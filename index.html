<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChat 1.4</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1117;
  color: #f5f7fa;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* AUTH */

.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.auth-card {
  width: 100%;
  max-width: 400px;
  background: #181c25;
  border: 1px solid #292f3d;
  border-radius: 18px;
  padding: 30px;
  box-shadow: 0 15px 50px rgba(0,0,0,.35);
}

.logo {
  text-align: center;
  font-size: 34px;
  font-weight: bold;
  margin-bottom: 8px;
}

.subtitle {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 25px;
}

.auth-card input {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: 1px solid #343b4b;
  border-radius: 10px;
  background: #10131a;
  color: white;
  outline: none;
}

.auth-card input:focus,
textarea:focus {
  border-color: #6675ff;
}

.primary-btn {
  width: 100%;
  border: none;
  padding: 13px;
  margin-top: 10px;
  border-radius: 10px;
  background: #5865f2;
  color: white;
  font-weight: bold;
}

.primary-btn:hover {
  background: #6975f5;
}

.link-btn {
  background: none;
  border: none;
  color: #7c8cff;
  margin-top: 16px;
  width: 100%;
}

/* APP */

.app {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

.topbar {
  height: 64px;
  background: #181c25;
  border-bottom: 1px solid #292f3d;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 18px;
}

.topbar-logo {
  font-size: 22px;
  font-weight: bold;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #5865f2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.logout-btn {
  background: #272d39;
  color: white;
  border: none;
  padding: 9px 13px;
  border-radius: 9px;
}

.main {
  flex: 1;
  display: flex;
  min-height: calc(100vh - 64px);
}

/* SIDEBAR */

.sidebar {
  width: 280px;
  background: #151922;
  border-right: 1px solid #292f3d;
  padding: 15px;
}

.tabs {
  display: flex;
  gap: 6px;
  margin-bottom: 15px;
}

.tab {
  flex: 1;
  border: none;
  background: #202530;
  color: #aeb5c2;
  padding: 10px 5px;
  border-radius: 9px;
}

.tab.active {
  background: #5865f2;
  color: white;
}

.panel-title {
  font-size: 18px;
  font-weight: bold;
  margin: 15px 3px 10px;
}

.search-box {
  width: 100%;
  padding: 11px;
  background: #10131a;
  color: white;
  border: 1px solid #343b4b;
  border-radius: 9px;
  outline: none;
}

.list {
  margin-top: 10px;
}

.list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px;
  border-radius: 10px;
  margin-bottom: 4px;
  cursor: pointer;
}

.list-item:hover {
  background: #202530;
}

.list-item.active {
  background: #282e3b;
}

.list-avatar {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #5865f2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.list-info {
  min-width: 0;
  flex: 1;
}

.list-name {
  font-weight: bold;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.status {
  font-size: 12px;
  color: #8e97a8;
}

.online {
  color: #55d68a;
}

.unread {
  min-width: 22px;
  height: 22px;
  border-radius: 11px;
  background: #ed4245;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: bold;
}

/* CONTENT */

.content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.empty-state {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8e97a8;
  text-align: center;
  padding: 30px;
}

/* CHAT */

.chat-header {
  min-height: 64px;
  border-bottom: 1px solid #292f3d;
  background: #181c25;
  display: flex;
  align-items: center;
  padding: 10px 18px;
  gap: 12px;
}

.chat-title {
  font-size: 18px;
  font-weight: bold;
}

.chat-subtitle {
  color: #8e97a8;
  font-size: 13px;
}

.messages {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
}

.message {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
  max-width: 850px;
}

.message-avatar {
  width: 36px;
  height: 36px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #5865f2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.message-content {
  min-width: 0;
}

.message-top {
  display: flex;
  align-items: baseline;
  gap: 8px;
}

.message-user {
  font-weight: bold;
}

.message-time {
  color: #737c8d;
  font-size: 11px;
}

.message-text {
  margin-top: 3px;
  color: #e2e6ec;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.edited {
  color: #737c8d;
  font-size: 10px;
  margin-left: 5px;
}

/* MESSAGE ACTIONS */

.message-actions {
  margin-top: 6px;
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
}

.message-action {
  border: 1px solid #343b4b;
  background: #1b202a;
  color: #b8c0cc;
  border-radius: 7px;
  padding: 3px 7px;
  font-size: 12px;
}

.message-action:hover {
  background: #272e3b;
  color: white;
}

/* REACTIONS */

.reactions {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-top: 6px;
}

.reaction {
  border: 1px solid #343b4b;
  background: #1a1f29;
  color: #e7ebf0;
  border-radius: 12px;
  padding: 3px 8px;
  font-size: 13px;
}

.reaction:hover {
  background: #292f3c;
}

.reaction-picker {
  display: flex;
  gap: 4px;
  background: #181c25;
  border: 1px solid #343b4b;
  border-radius: 9px;
  padding: 5px;
}

.reaction-picker button {
  background: none;
  border: none;
  font-size: 18px;
  padding: 4px;
  border-radius: 6px;
}

.reaction-picker button:hover {
  background: #292f3c;
}

/* INPUT */

.chat-input-area {
  padding: 12px 16px;
  border-top: 1px solid #292f3d;
  background: #181c25;
}

.chat-input-row {
  display: flex;
  gap: 8px;
}

.chat-input {
  flex: 1;
  min-width: 0;
  padding: 12px;
  background: #10131a;
  border: 1px solid #343b4b;
  border-radius: 10px;
  color: white;
  outline: none;
}

.send-btn {
  border: none;
  background: #5865f2;
  color: white;
  padding: 0 18px;
  border-radius: 10px;
  font-weight: bold;
}

/* PROFILE */

.profile {
  max-width: 650px;
  width: 100%;
  margin: 30px auto;
  padding: 25px;
}

.profile-card {
  background: #181c25;
  border: 1px solid #292f3d;
  border-radius: 15px;
  padding: 25px;
}

.profile-big-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #5865f2;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: bold;
  margin-bottom: 15px;
}

.profile-card label {
  display: block;
  color: #aeb5c2;
  margin-top: 15px;
  margin-bottom: 6px;
}

.profile-card input,
.profile-card textarea {
  width: 100%;
  background: #10131a;
  color: white;
  border: 1px solid #343b4b;
  border-radius: 9px;
  padding: 11px;
  outline: none;
}

.profile-card textarea {
  min-height: 100px;
  resize: vertical;
}

.save-profile {
  margin-top: 15px;
  border: none;
  background: #5865f2;
  color: white;
  padding: 11px 17px;
  border-radius: 9px;
  font-weight: bold;
}

/* FRIENDS */

.friend-actions {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

.small-btn {
  border: none;
  background: #303745;
  color: white;
  padding: 6px 9px;
  border-radius: 7px;
  font-size: 12px;
}

.small-btn:hover {
  background: #414b5d;
}

.danger-btn {
  background: #7c3034;
}

.danger-btn:hover {
  background: #983a3f;
}

/* EDIT */

.edit-box {
  display: flex;
  gap: 6px;
  margin-top: 5px;
}

.edit-box input {
  flex: 1;
  background: #10131a;
  color: white;
  border: 1px solid #5865f2;
  border-radius: 7px;
  padding: 7px;
  outline: none;
}

/* ROOM */

.room-controls {
  display: flex;
  gap: 7px;
  margin-bottom: 12px;
}

.room-controls input {
  flex: 1;
  min-width: 0;
  background: #10131a;
  color: white;
  border: 1px solid #343b4b;
  border-radius: 8px;
  padding: 10px;
  outline: none;
}

.room-controls button {
  border: none;
  background: #5865f2;
  color: white;
  padding: 0 13px;
  border-radius: 8px;
}

/* MOBILE */

@media (max-width: 700px) {
  .sidebar {
    width: 100%;
    max-width: 100%;
    border-right: none;
    border-bottom: 1px solid #292f3d;
  }

  .main {
    flex-direction: column;
  }

  .sidebar {
    max-height: 300px;
    overflow-y: auto;
  }

  .content {
    min-height: 500px;
  }

  .topbar-logo {
    font-size: 19px;
  }

  .topbar {
    padding: 0 10px;
  }

  .user-info span {
    display: none;
  }

  .messages {
    padding: 14px;
  }
}
</style>
</head>

<body>

<!-- LOGIN -->

<div id="loginScreen" class="auth-screen">
  <div class="auth-card">
    <div class="logo">MyChat</div>
    <div class="subtitle">Chat with friends. Keep it simple.</div>

    <input id="loginUsername" placeholder="Username" autocomplete="username">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">

    <button id="loginBtn" class="primary-btn">Log In</button>
    <button id="showCreateBtn" class="link-btn">Create an account</button>

    <div id="loginMessage" class="subtitle"></div>
  </div>
</div>

<!-- CREATE ACCOUNT -->

<div id="createScreen" class="auth-screen hidden">
  <div class="auth-card">
    <div class="logo">Create Account</div>
    <div class="subtitle">Join MyChat</div>

    <input id="createUsername" placeholder="Username">
    <input id="createPassword" type="password" placeholder="Password">
    <input id="createPassword2" type="password" placeholder="Confirm password">

    <button id="createBtn" class="primary-btn">Create Account</button>
    <button id="showLoginBtn" class="link-btn">Back to login</button>

    <div id="createMessage" class="subtitle"></div>
  </div>
</div>

<!-- APP -->

<div id="app" class="app hidden">

  <div class="topbar">
    <div class="topbar-logo">MyChat</div>

    <div class="user-info">
      <div id="topAvatar" class="avatar">?</div>
      <span id="topUsername"></span>
      <button id="logoutBtn" class="logout-btn">Log out</button>
    </div>
  </div>

  <div class="main">

    <!-- SIDEBAR -->

    <aside class="sidebar">

      <div class="tabs">
        <button id="friendsTab" class="tab active">Friends</button>
        <button id="roomsTab" class="tab">Rooms</button>
        <button id="profileTab" class="tab">Profile</button>
      </div>

      <!-- FRIENDS PANEL -->

      <div id="friendsPanel">

        <input id="friendSearch" class="search-box" placeholder="Search username">

        <button id="addFriendBtn" class="primary-btn">Add Friend</button>

        <div class="panel-title">Friends</div>
        <div id="friendsList" class="list"></div>

        <div class="panel-title">Requests</div>
        <div id="requestsList" class="list"></div>

        <div class="panel-title">Messages</div>
        <div id="conversationsList" class="list"></div>

      </div>

      <!-- ROOMS PANEL -->

      <div id="roomsPanel" class="hidden">

        <div class="panel-title">Join a Room</div>

        <div class="room-controls">
          <input id="roomCodeInput" maxlength="4" placeholder="4-digit code">
          <button id="joinRoomBtn">Join</button>
        </div>

        <div class="panel-title">Current Room</div>
        <div id="currentRoomInfo" class="status">No room joined.</div>

      </div>

      <!-- PROFILE PANEL -->

      <div id="profilePanel" class="hidden">

        <div class="panel-title">Your Profile</div>

        <div id="profileSidebarAvatar" class="profile-big-avatar">?</div>

        <div id="profileSidebarName"></div>

      </div>

    </aside>

    <!-- CONTENT -->

    <section class="content">

      <div id="emptyState" class="empty-state">
        <div>
          <h2>Welcome to MyChat</h2>
          <p>Select a friend, conversation, or room to start chatting.</p>
        </div>
      </div>

      <!-- CHAT -->

      <div id="chatView" class="hidden" style="height:100%; display:flex; flex-direction:column;">

        <div class="chat-header">
          <div id="chatAvatar" class="avatar">?</div>

          <div>
            <div id="chatTitle" class="chat-title"></div>
            <div id="chatSubtitle" class="chat-subtitle"></div>
          </div>
        </div>

        <div id="messages" class="messages"></div>

        <div class="chat-input-area">
          <div class="chat-input-row">
            <input id="messageInput" class="chat-input" placeholder="Type a message...">
            <button id="sendBtn" class="send-btn">Send</button>
          </div>
        </div>

      </div>

      <!-- PROFILE -->

      <div id="profileView" class="hidden">

        <div class="profile">

          <div class="profile-card">

            <div id="bigProfileAvatar" class="profile-big-avatar">?</div>

            <label>Username</label>
            <input id="profileUsername" disabled>

            <label>Display Name</label>
            <input id="displayNameInput" maxlength="30">

            <label>Bio</label>
            <textarea id="bioInput" maxlength="200"></textarea>

            <button id="saveProfileBtn" class="save-profile">
              Save Profile
            </button>

            <div id="profileMessage" class="status"></div>

          </div>

        </div>

      </div>

    </section>

  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  push,
  remove,
  onChildAdded,
  onChildChanged,
  onChildRemoved,
  onDisconnect
} from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyDFun3M-6mzjBL8DFcfmJzDv7blNODQd0",
  authDomain: "mychat-8dac2.firebaseapp.com",
  databaseURL: "https://mychat-8dac2-default-rtdb.firebaseio.com",
  projectId: "mychat-8dac2",
  storageBucket: "mychat-8dac2.firebasestorage.app",
  messagingSenderId: "906137277444",
  appId: "1:906137277444:web:b9d52ef4ec1f76afe09151"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* STATE */

let currentUser = null;
let currentRoom = null;
let currentDMUser = null;

let stopDMListener = null;
let stopRoomListener = null;


/* HELPERS */

function key(username) {
  return username.toLowerCase();
}

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text;
  return div.innerHTML;
}

async function hashPassword(password) {
  const data = new TextEncoder().encode(password);
  const hash = await crypto.subtle.digest("SHA-256", data);

  return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

function conversationId(a, b) {
  return [key(a), key(b)].sort().join("_");
}

function formatTime(timestamp) {
  if (!timestamp) return "";

  const date = new Date(timestamp);

  return date.toLocaleTimeString([], {
    hour: "numeric",
    minute: "2-digit"
  });
}


/* SCREENS */

function showLogin() {
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("createScreen").classList.add("hidden");
  document.getElementById("app").classList.add("hidden");
}

function showCreate() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("createScreen").classList.remove("hidden");
}

function showHome() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("createScreen").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");

  updateTopBar();
  loadFriends();
  loadRequests();
  loadConversations();
}


/* ACCOUNT CREATION */

async function createAccount() {

  const username = document.getElementById("createUsername").value.trim();
  const password = document.getElementById("createPassword").value;
  const password2 = document.getElementById("createPassword2").value;

  const msg = document.getElementById("createMessage");

  if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
    msg.textContent = "Username must be 3–20 characters.";
    return;
  }

  if (password.length < 4) {
    msg.textContent = "Password must be at least 4 characters.";
    return;
  }

  if (password !== password2) {
    msg.textContent = "Passwords do not match.";
    return;
  }

  const userRef = ref(db, "users/" + key(username));
  const snapshot = await get(userRef);

  if (snapshot.exists()) {
    msg.textContent = "That username is already taken.";
    return;
  }

  const passwordHash = await hashPassword(password);

  await set(userRef, {
    username: username,
    passwordHash: passwordHash,
    displayName: username,
    bio: "",
    online: false
  });

  msg.textContent = "Account created!";

  setTimeout(() => {
    showLogin();
  }, 700);
}


/* LOGIN */

async function login() {

  const username = document.getElementById("loginUsername").value.trim();
  const password = document.getElementById("loginPassword").value;

  const msg = document.getElementById("loginMessage");

  if (!username || !password) {
    msg.textContent = "Enter your username and password.";
    return;
  }

  const userRef = ref(db, "users/" + key(username));
  const snapshot = await get(userRef);

  if (!snapshot.exists()) {
    msg.textContent = "Invalid username or password.";
    return;
  }

  const user = snapshot.val();
  const passwordHash = await hashPassword(password);

  if (user.passwordHash !== passwordHash) {
    msg.textContent = "Invalid username or password.";
    return;
  }

  currentUser = username;

  await set(ref(db, "users/" + key(username) + "/online"), true);

  onDisconnect(
    ref(db, "users/" + key(username) + "/online")
  ).set(false);

  showHome();
}


/* TOP BAR */

async function updateTopBar() {

  const snapshot = await get(
    ref(db, "users/" + key(currentUser))
  );

  if (!snapshot.exists()) return;

  const user = snapshot.val();

  const displayName = user.displayName || currentUser;

  document.getElementById("topUsername").textContent = displayName;

  document.getElementById("topAvatar").textContent =
    displayName.charAt(0).toUpperCase();

  document.getElementById("profileSidebarAvatar").textContent =
    displayName.charAt(0).toUpperCase();

  document.getElementById("profileSidebarName").textContent =
    displayName;
}


/* TABS */

function selectTab(tab) {

  document.querySelectorAll(".tab").forEach(btn => {
    btn.classList.remove("active");
  });

  document.getElementById(tab + "Tab").classList.add("active");

  document.getElementById("friendsPanel").classList.add("hidden");
  document.getElementById("roomsPanel").classList.add("hidden");
  document.getElementById("profilePanel").classList.add("hidden");

  document.getElementById("profileView").classList.add("hidden");

  if (tab === "friends") {
    document.getElementById("friendsPanel").classList.remove("hidden");
  }

  if (tab === "rooms") {
    document.getElementById("roomsPanel").classList.remove("hidden");
  }

  if (tab === "profile") {
    document.getElementById("profilePanel").classList.remove("hidden");
    openProfile();
  }
}


/* FRIENDS */

async function loadFriends() {

  const list = document.getElementById("friendsList");
  list.innerHTML = "";

  const snapshot = await get(
    ref(db, "users/" + key(currentUser) + "/friends")
  );

  if (!snapshot.exists()) {
    list.innerHTML = `<div class="status">No friends yet.</div>`;
    return;
  }

  const friends = snapshot.val();

  for (const friendKey of Object.keys(friends)) {

    const friendSnapshot = await get(
      ref(db, "users/" + friendKey)
    );

    if (!friendSnapshot.exists()) continue;

    const friend = friendSnapshot.val();

    const item = document.createElement("div");
    item.className = "list-item";

    const displayName = friend.displayName || friend.username;

    item.innerHTML = `
      <div class="list-avatar">
        ${escapeHTML(displayName.charAt(0).toUpperCase())}
      </div>

      <div class="list-info">
        <div class="list-name">${escapeHTML(displayName)}</div>

        <div class="status ${friend.online ? "online" : ""}">
          ${friend.online ? "● Online" : "Offline"}
        </div>
      </div>
    `;

    item.addEventListener("click", () => {
      openDM(friend.username);
    });

    list.appendChild(item);
  }
}


/* FRIEND REQUESTS */

async function loadRequests() {

  const list = document.getElementById("requestsList");
  list.innerHTML = "";

  const snapshot = await get(
    ref(db, "users/" + key(currentUser) + "/friendRequests")
  );

  if (!snapshot.exists()) {
    list.innerHTML = `<div class="status">No pending requests.</div>`;
    return;
  }

  const requests = snapshot.val();

  for (const requesterKey of Object.keys(requests)) {

    const userSnapshot = await get(
      ref(db, "users/" + requesterKey)
    );

    if (!userSnapshot.exists()) continue;

    const user = userSnapshot.val();

    const item = document.createElement("div");
    item.className = "list-item";

    item.innerHTML = `
      <div class="list-avatar">
        ${escapeHTML((user.displayName || user.username).charAt(0).toUpperCase())}
      </div>

      <div class="list-info">
        <div class="list-name">
          ${escapeHTML(user.displayName || user.username)}
        </div>

        <div class="friend-actions">
          <button class="small-btn accept">Accept</button>
          <button class="small-btn danger-btn decline">Decline</button>
        </div>
      </div>
    `;

    item.querySelector(".accept").addEventListener("click", async e => {
      e.stopPropagation();

      await set(
        ref(db, `users/${key(currentUser)}/friends/${requesterKey}`),
        true
      );

      await set(
        ref(db, `users/${requesterKey}/friends/${key(currentUser)}`),
        true
      );

      await remove(
        ref(db, `users/${key(currentUser)}/friendRequests/${requesterKey}`)
      );

      loadRequests();
      loadFriends();
    });

    item.querySelector(".decline").addEventListener("click", async e => {
      e.stopPropagation();

      await remove(
        ref(db, `users/${key(currentUser)}/friendRequests/${requesterKey}`)
      );

      loadRequests();
    });

    list.appendChild(item);
  }
}


/* ADD FRIEND */

async function addFriend() {

  const username =
    document.getElementById("friendSearch").value.trim();

  if (!username) return;

  if (key(username) === key(currentUser)) {
    alert("You can't add yourself.");
    return;
  }

  const userSnapshot = await get(
    ref(db, "users/" + key(username))
  );

  if (!userSnapshot.exists()) {
    alert("User not found.");
    return;
  }

  await set(
    ref(db, `users/${key(username)}/friendRequests/${key(currentUser)}`),
    true
  );

  document.getElementById("friendSearch").value = "";

  alert("Friend request sent!");
}


/* CONVERSATIONS */

async function loadConversations() {

  const list = document.getElementById("conversationsList");
  list.innerHTML = "";

  const snapshot = await get(
    ref(db, "users/" + key(currentUser) + "/conversations")
  );

  if (!snapshot.exists()) {
    list.innerHTML = `<div class="status">No conversations yet.</div>`;
    return;
  }

  const conversations = snapshot.val();

  for (const otherKey of Object.keys(conversations)) {

    const userSnapshot = await get(
      ref(db, "users/" + otherKey)
    );

    if (!userSnapshot.exists()) continue;

    const user = userSnapshot.val();

    const unreadSnapshot = await get(
      ref(db, `users/${key(currentUser)}/unread/${otherKey}`)
    );

    const unread = unreadSnapshot.exists()
      ? unreadSnapshot.val()
      : 0;

    const displayName = user.displayName || user.username;

    const item = document.createElement("div");
    item.className = "list-item";

    item.innerHTML = `
      <div class="list-avatar">
        ${escapeHTML(displayName.charAt(0).toUpperCase())}
      </div>

      <div class="list-info">
        <div class="list-name">${escapeHTML(displayName)}</div>
      </div>

      ${unread > 0 ? `<div class="unread">${unread}</div>` : ""}
    `;

    item.addEventListener("click", () => {
      openDM(user.username);
    });

    list.appendChild(item);
  }
}


/* OPEN DM */

async function openDM(username) {

  currentDMUser = username;

  if (stopDMListener) {
    stopDMListener();
    stopDMListener = null;
  }

  if (stopRoomListener) {
    stopRoomListener();
    stopRoomListener = null;
  }

  currentRoom = null;

  document.getElementById("emptyState").classList.add("hidden");
  document.getElementById("profileView").classList.add("hidden");
  document.getElementById("chatView").classList.remove("hidden");

  const userSnapshot = await get(
    ref(db, "users/" + key(username))
  );

  const user = userSnapshot.exists()
    ? userSnapshot.val()
    : {};

  const displayName = user.displayName || username;

  document.getElementById("chatTitle").textContent =
    displayName;

  document.getElementById("chatSubtitle").textContent =
    user.online ? "● Online" : "Offline";

  document.getElementById("chatSubtitle").className =
    "chat-subtitle " + (user.online ? "online" : "");

  document.getElementById("chatAvatar").textContent =
    displayName.charAt(0).toUpperCase();

  const messages = document.getElementById("messages");
  messages.innerHTML = "";

  const conv = conversationId(currentUser, username);

  await set(
    ref(db, `users/${key(currentUser)}/unread/${key(username)}`),
    0
  );

  loadConversations();

  const messagesRef =
    ref(db, `directMessages/${conv}/messages`);

  stopDMListener = onChildAdded(messagesRef, snapshot => {
    renderDMMessage(snapshot.key, snapshot.val());
  });

  onChildChanged(messagesRef, snapshot => {
    updateDMMessage(snapshot.key, snapshot.val());
  });

  onChildRemoved(messagesRef, snapshot => {
    const element = document.querySelector(
      `[data-message-id="${snapshot.key}"]`
    );

    if (element) {
      element.remove();
    }
  });
}


/* RENDER DM MESSAGE */

function renderDMMessage(id, data) {

  const messages = document.getElementById("messages");

  if (document.querySelector(`[data-message-id="${id}"]`)) {
    return;
  }

  const wrapper = document.createElement("div");
  wrapper.className = "message";
  wrapper.dataset.messageId = id;

  const displayName = data.username || "Unknown";

  wrapper.innerHTML = `
    <div class="message-avatar">
      ${escapeHTML(displayName.charAt(0).toUpperCase())}
    </div>

    <div class="message-content">

      <div class="message-top">
        <span class="message-user">
          ${escapeHTML(displayName)}
        </span>

        <span class="message-time">
          ${formatTime(data.timestamp)}
        </span>
      </div>

      <div class="message-text"></div>

      <div class="reactions"></div>

      <div class="message-actions"></div>

    </div>
  `;

  wrapper.querySelector(".message-text").textContent =
    data.text || "";

  if (data.edited) {
    const edited = document.createElement("span");
    edited.className = "edited";
    edited.textContent = "edited";
    wrapper.querySelector(".message-text").appendChild(edited);
  }

  renderReactions(
    wrapper.querySelector(".reactions"),
    id,
    data.reactions || {}
  );

  const actions = wrapper.querySelector(".message-actions");

  const reactButton = document.createElement("button");
  reactButton.className = "message-action";
  reactButton.textContent = "😊 React";

  reactButton.addEventListener("click", () => {
    showReactionPicker(wrapper, id);
  });

  actions.appendChild(reactButton);

  if (key(data.username) === key(currentUser)) {

    const editButton = document.createElement("button");
    editButton.className = "message-action";
    editButton.textContent = "✏️ Edit";

    editButton.addEventListener("click", () => {
      startEditing(wrapper, id, data);
    });

    actions.appendChild(editButton);

    const deleteButton = document.createElement("button");
    deleteButton.className = "message-action";
    deleteButton.textContent = "🗑️ Delete";

    deleteButton.addEventListener("click", async () => {

      if (!confirm("Delete this message?")) return;

      const conv = conversationId(
        currentUser,
        currentDMUser
      );

      await remove(
        ref(db, `directMessages/${conv}/messages/${id}`)
      );
    });

    actions.appendChild(deleteButton);
  }

  messages.appendChild(wrapper);

  messages.scrollTop = messages.scrollHeight;
}


/* UPDATE MESSAGE */

function updateDMMessage(id, data) {

  const wrapper = document.querySelector(
    `[data-message-id="${id}"]`
  );

  if (!wrapper) return;

  const text = wrapper.querySelector(".message-text");

  text.textContent = data.text || "";

  if (data.edited) {
    const edited = document.createElement("span");
    edited.className = "edited";
    edited.textContent = "edited";
    text.appendChild(edited);
  }

  renderReactions(
    wrapper.querySelector(".reactions"),
    id,
    data.reactions || {}
  );
}


/* REACTIONS */

const reactionOptions = ["👍", "❤️", "😂", "😮", "😢"];

function renderReactions(container, messageId, reactions) {

  container.innerHTML = "";

  const counts = {};

  for (const username in reactions) {

    const emoji = reactions[username];

    if (!counts[emoji]) {
      counts[emoji] = [];
    }

    counts[emoji].push(username);
  }

  for (const emoji of Object.keys(counts)) {

    const button = document.createElement("button");
    button.className = "reaction";

    button.textContent =
      emoji + " " + counts[emoji].length;

    button.addEventListener("click", () => {
      setReaction(messageId, emoji);
    });

    container.appendChild(button);
  }
}


function showReactionPicker(wrapper, messageId) {

  const existing =
    wrapper.querySelector(".reaction-picker");

  if (existing) {
    existing.remove();
    return;
  }

  const picker = document.createElement("div");
  picker.className = "reaction-picker";

  reactionOptions.forEach(emoji => {

    const button = document.createElement("button");
    button.textContent = emoji;

    button.addEventListener("click", async () => {
      await setReaction(messageId, emoji);
      picker.remove();
    });

    picker.appendChild(button);
  });

  wrapper.querySelector(".message-actions")
    .before(picker);
}


async function setReaction(messageId, emoji) {

  if (!currentDMUser) return;

  const conv = conversationId(
    currentUser,
    currentDMUser
  );

  const messageRef =
    ref(db, `directMessages/${conv}/messages/${messageId}`);

  const snapshot = await get(messageRef);

  if (!snapshot.exists()) return;

  const data = snapshot.val();

  const reactions = data.reactions || {};

  if (reactions[key(currentUser)] === emoji) {
    delete reactions[key(currentUser)];
  } else {
    reactions[key(currentUser)] = emoji;
  }

  await set(
    ref(db, `directMessages/${conv}/messages/${messageId}/reactions`),
    reactions
  );
}


/* EDIT MESSAGE */

function startEditing(wrapper, id, data) {

  if (wrapper.querySelector(".edit-box")) return;

  const textElement =
    wrapper.querySelector(".message-text");

  textElement.classList.add("hidden");

  const editBox = document.createElement("div");
  editBox.className = "edit-box";

  editBox.innerHTML = `
    <input value="${escapeHTML(data.text || "")}">
    <button class="small-btn save">Save</button>
    <button class="small-btn cancel">Cancel</button>
  `;

  textElement.after(editBox);

  const input = editBox.querySelector("input");

  input.focus();
  input.select();

  editBox.querySelector(".save")
    .addEventListener("click", () => {
      saveEdit(id, input.value.trim());
    });

  editBox.querySelector(".cancel")
    .addEventListener("click", () => {
      editBox.remove();
      textElement.classList.remove("hidden");
    });

  input.addEventListener("keydown", e => {

    if (e.key === "Enter") {
      saveEdit(id, input.value.trim());
    }

    if (e.key === "Escape") {
      editBox.remove();
      textElement.classList.remove("hidden");
    }
  });
}


async function saveEdit(id, newText) {

  if (!newText) return;

  const conv = conversationId(
    currentUser,
    currentDMUser
  );

  await set(
    ref(db, `directMessages/${conv}/messages/${id}/text`),
    newText
  );

  await set(
    ref(db, `directMessages/${conv}/messages/${id}/edited`),
    true
  );
}


/* SEND DM */

async function sendDM() {

  if (!currentDMUser) return;

  const input =
    document.getElementById("messageInput");

  const text = input.value.trim();

  if (!text) return;

  const conv = conversationId(
    currentUser,
    currentDMUser
  );

  const messagesRef =
    ref(db, `directMessages/${conv}/messages`);

  await push(messagesRef, {
    username: currentUser,
    text: text,
    timestamp: Date.now(),
    edited: false
  });

  await set(
    ref(db, `users/${key(currentUser)}/conversations/${key(currentDMUser)}`),
    true
  );

  await set(
    ref(db, `users/${key(currentDMUser)}/conversations/${key(currentUser)}`),
    true
  );

  const unreadRef =
    ref(db, `users/${key(currentDMUser)}/unread/${key(currentUser)}`);

  const unreadSnapshot = await get(unreadRef);

  const unread = unreadSnapshot.exists()
    ? unreadSnapshot.val()
    : 0;

  await set(unreadRef, unread + 1);

  input.value = "";
}


/* ROOMS */

async function joinRoom() {

  const code =
    document.getElementById("roomCodeInput").value.trim();

  if (!/^\d{4}$/.test(code)) {
    alert("Room code must be exactly 4 digits.");
    return;
  }

  if (stopDMListener) {
    stopDMListener();
    stopDMListener = null;
  }

  if (stopRoomListener) {
    stopRoomListener();
    stopRoomListener = null;
  }

  currentDMUser = null;
  currentRoom = code;

  document.getElementById("emptyState").classList.add("hidden");
  document.getElementById("profileView").classList.add("hidden");
  document.getElementById("chatView").classList.remove("hidden");

  document.getElementById("chatTitle").textContent =
    "Room #" + code;

  document.getElementById("chatSubtitle").textContent =
    "4-digit room";

  document.getElementById("chatAvatar").textContent =
    "#";

  document.getElementById("messages").innerHTML = "";

  document.getElementById("currentRoomInfo").textContent =
    "Joined room #" + code;

  const messagesRef =
    ref(db, `rooms/${code}/messages`);

  stopRoomListener = onChildAdded(
    messagesRef,
    snapshot => {
      renderRoomMessage(snapshot.key, snapshot.val());
    }
  );

  await push(messagesRef, {
    username: "MyChat",
    text: currentUser + " joined the room.",
    timestamp: Date.now(),
    system: true
  });
}


/* ROOM MESSAGE */

function renderRoomMessage(id, data) {

  const messages = document.getElementById("messages");

  const wrapper = document.createElement("div");
  wrapper.className = "message";
  wrapper.dataset.messageId = id;

  wrapper.innerHTML = `
    <div class="message-avatar">
      ${escapeHTML((data.username || "?").charAt(0).toUpperCase())}
    </div>

    <div class="message-content">

      <div class="message-top">
        <span class="message-user">
          ${escapeHTML(data.username || "")}
        </span>

        <span class="message-time">
          ${formatTime(data.timestamp)}
        </span>
      </div>

      <div class="message-text"></div>

    </div>
  `;

  wrapper.querySelector(".message-text").textContent =
    data.text || "";

  messages.appendChild(wrapper);

  messages.scrollTop = messages.scrollHeight;
}


/* SEND ROOM */

async function sendRoomMessage() {

  if (!currentRoom) return;

  const input =
    document.getElementById("messageInput");

  const text = input.value.trim();

  if (!text) return;

  await push(
    ref(db, `rooms/${currentRoom}/messages`),
    {
      username: currentUser,
      text: text,
      timestamp: Date.now()
    }
  );

  input.value = "";
}


/* SEND */

function sendMessage() {

  if (currentDMUser) {
    sendDM();
  } else if (currentRoom) {
    sendRoomMessage();
  }
}


/* PROFILE */

async function openProfile() {

  document.getElementById("emptyState").classList.add("hidden");
  document.getElementById("chatView").classList.add("hidden");
  document.getElementById("profileView").classList.remove("hidden");

  const snapshot = await get(
    ref(db, "users/" + key(currentUser))
  );

  if (!snapshot.exists()) return;

  const user = snapshot.val();

  const displayName =
    user.displayName || currentUser;

  document.getElementById("profileUsername").value =
    currentUser;

  document.getElementById("displayNameInput").value =
    displayName;

  document.getElementById("bioInput").value =
    user.bio || "";

  document.getElementById("bigProfileAvatar").textContent =
    displayName.charAt(0).toUpperCase();
}


async function saveProfile() {

  const displayName =
    document.getElementById("displayNameInput")
      .value.trim();

  const bio =
    document.getElementById("bioInput")
      .value.trim();

  if (!displayName) {
    alert("Display name can't be empty.");
    return;
  }

  await set(
    ref(db, `users/${key(currentUser)}/displayName`),
    displayName
  );

  await set(
    ref(db, `users/${key(currentUser)}/bio`),
    bio
  );

  document.getElementById("profileMessage").textContent =
    "Profile saved!";

  updateTopBar();

  setTimeout(() => {
    document.getElementById("profileMessage").textContent = "";
  }, 2000);
}


/* LOGOUT */

async function logout() {

  if (!currentUser) return;

  await set(
    ref(db, `users/${key(currentUser)}/online`),
    false
  );

  if (stopDMListener) {
    stopDMListener();
    stopDMListener = null;
  }

  if (stopRoomListener) {
    stopRoomListener();
    stopRoomListener = null;
  }

  currentUser = null;
  currentDMUser = null;
  currentRoom = null;

  document.getElementById("messages").innerHTML = "";

  showLogin();
}

document.getElementById("showCreateBtn")

document.getElementById("showLoginBtn")
  .addEventListener("click", showLogin);

  .addEventListener("click", createAccount);

document.getElementById("joinRoomBtn")
  .addEventListener("click", joinRoom);

document.getElementById("saveProfileBtn")
  .addEventListener("click", saveProfile);

  .addEventListener("click", sendMessage);


/* ENTER KEY */

document.getElementById("messageInput")
  .addEventListener("keydown", e => {

    if (e.key === "Enter") {
      e.preventDefault();
      sendMessage();
    }

  });

document.getElementById("loginPassword")

  .addEventListener("keydown", e => {

  });

  .addEventListener("keydown", e => {
    if (e.key === "Enter") addFriend();
  });

showLogin();
