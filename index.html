<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  push,
  onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyDFun3M-6mzjBL8DFcfmJzDv7blNODQd0",
  authDomain: "mychat-8dac2.firebaseapp.com",
  databaseURL: "https://mychat-8dac2-default-rtdb.firebaseio.com",
  projectId: "mychat-8dac2",
  storageBucket: "mychat-8dac2.firebasestorage.app",
  messagingSenderId: "906137277444",
  appId: "1:906137277444:web:b9d52ef4ec1f76afe09151"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* VARIABLES */

let currentUser = null;
let currentRoom = null;
let currentDMUser = null;

let roomListener = null;
let dmListener = null;


/* HELPERS */

function key(username) {
  return username.toLowerCase();
}

function hideScreens() {
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("createScreen").classList.add("hidden");
  document.getElementById("homeScreen").classList.add("hidden");
  document.getElementById("dmScreen").classList.add("hidden");
  document.getElementById("chatScreen").classList.add("hidden");
}


/* LOGIN SCREEN */

function showLogin() {
  hideScreens();

  document.getElementById("loginScreen")
    .classList.remove("hidden");

  document.getElementById("loginError")
    .textContent = "";
}

function showCreate() {
  hideScreens();

  document.getElementById("createScreen")
    .classList.remove("hidden");

  document.getElementById("createError")
    .textContent = "";

  document.getElementById("createSuccess")
    .textContent = "";
}


/* HASH PASSWORD */

async function hashPassword(password) {

  const data =
    new TextEncoder().encode(password);

  const hash =
    await crypto.subtle.digest("SHA-256", data);

  return Array.from(new Uint8Array(hash))
    .map(x => x.toString(16).padStart(2, "0"))
    .join("");
}


/* CREATE ACCOUNT */

async function createAccount() {

  const username =
    document.getElementById("createUsername")
      .value.trim();

  const password =
    document.getElementById("createPassword")
      .value;

  const confirm =
    document.getElementById("confirmPassword")
      .value;

  const error =
    document.getElementById("createError");

  const success =
    document.getElementById("createSuccess");


  error.textContent = "";
  success.textContent = "";


  if (username.length < 3) {
    error.textContent =
      "Username must be at least 3 characters.";
    return;
  }

  if (!/^[a-zA-Z0-9_]+$/.test(username)) {
    error.textContent =
      "Username can only contain letters, numbers, and _.";
    return;
  }

  if (password.length < 4) {
    error.textContent =
      "Password must be at least 4 characters.";
    return;
  }

  if (password !== confirm) {
    error.textContent =
      "Passwords do not match.";
    return;
  }


  try {

    const usernameKey = key(username);

    const userRef =
      ref(db, "users/" + usernameKey);

    const existing =
      await get(userRef);

    if (existing.exists()) {
      error.textContent =
        "That username is already taken.";
      return;
    }


    const passwordHash =
      await hashPassword(password);


    await set(userRef, {
      username: username,
      passwordHash: passwordHash
    });


    success.textContent =
      "Account created! You can now log in.";

    document.getElementById("createUsername").value = "";
    document.getElementById("createPassword").value = "";
    document.getElementById("confirmPassword").value = "";

  } catch (errorObject) {

    console.error(errorObject);

    error.textContent =
      "Could not create account.";
  }
}


/* LOGIN */

async function login() {

  const username =
    document.getElementById("loginUsername")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  const error =
    document.getElementById("loginError");


  error.textContent = "";


  if (!username || !password) {
    error.textContent =
      "Enter your username and password.";
    return;
  }


  try {

    const userRef =
      ref(db, "users/" + key(username));

    const snapshot =
      await get(userRef);


    if (!snapshot.exists()) {
      error.textContent =
        "Username or password is incorrect.";
      return;
    }


    const account =
      snapshot.val();

    const passwordHash =
      await hashPassword(password);


    if (passwordHash !== account.passwordHash) {
      error.textContent =
        "Username or password is incorrect.";
      return;
    }


    currentUser = account.username;

    document.getElementById("loginPassword")
      .value = "";

    showHome();

  } catch (errorObject) {

    console.error(errorObject);

    error.textContent =
      "Could not log in. Please try again.";
  }
}


/* HOME */

function showHome() {

  hideScreens();

  document.getElementById("homeScreen")
    .classList.remove("hidden");

  document.getElementById("homeUsername")
    .textContent = currentUser;

  showFriendsTab();

  loadFriends();
  loadRequests();
  loadConversations();
}


/* TABS */

function showFriendsTab() {

  document.getElementById("friendsContent")
    .classList.remove("hidden");

  document.getElementById("roomsContent")
    .classList.add("hidden");

  document.getElementById("friendsTab")
    .classList.add("active");

  document.getElementById("roomsTab")
    .classList.remove("active");
}

function showRoomsTab() {

  document.getElementById("friendsContent")
    .classList.add("hidden");

  document.getElementById("roomsContent")
    .classList.remove("hidden");

  document.getElementById("friendsTab")
    .classList.remove("active");

  document.getElementById("roomsTab")
    .classList.add("active");
}


/* FRIEND REQUEST */

async function addFriend() {

  const username =
    document.getElementById("friendSearch")
      .value.trim();

  const error =
    document.getElementById("friendError");

  const success =
    document.getElementById("friendSuccess");


  error.textContent = "";
  success.textContent = "";


  if (!username) {
    error.textContent =
      "Enter a username.";
    return;
  }


  if (key(username) === key(currentUser)) {
    error.textContent =
      "You can't add yourself.";
    return;
  }


  try {

    const targetRef =
      ref(db, "users/" + key(username));

    const target =
      await get(targetRef);


    if (!target.exists()) {
      error.textContent =
        "That user doesn't exist.";
      return;
    }


    const targetUser =
      target.val().username;


    const alreadyFriend =
      await get(
        ref(
          db,
          "users/" +
          key(currentUser) +
          "/friends/" +
          key(targetUser)
        )
      );


    if (alreadyFriend.exists()) {
      error.textContent =
        "You're already friends.";
      return;
    }


    await set(
      ref(
        db,
        "users/" +
        key(targetUser) +
        "/friendRequests/" +
        key(currentUser)
      ),
      {
        username: currentUser,
        timestamp: Date.now()
      }
    );


    document.getElementById("friendSearch")
      .value = "";

    success.textContent =
      "Friend request sent!";

  } catch (errorObject) {

    console.error(errorObject);

    error.textContent =
      "Couldn't send friend request.";
  }
}


/* LOAD REQUESTS */

async function loadRequests() {

  const list =
    document.getElementById("requestsList");

  list.innerHTML = "";


  try {

    const snapshot =
      await get(
        ref(
          db,
          "users/" +
          key(currentUser) +
          "/friendRequests"
        )
      );


    if (!snapshot.exists()) {

      list.innerHTML =
        '<div class="empty">No friend requests.</div>';

      return;
    }


    snapshot.forEach(child => {

      const request = child.val();

      const item =
        document.createElement("div");

      item.className = "list-item";


      const avatar =
        document.createElement("div");

      avatar.className = "avatar";

      avatar.textContent =
        request.username[0].toUpperCase();


      const info =
        document.createElement("div");

      info.className = "item-info";

      info.innerHTML =
        `<div class="item-name">${escapeHTML(request.username)}</div>
         <div class="item-subtitle">Friend request</div>`;


      const accept =
        document.createElement("button");

      accept.className = "item-button";

      accept.textContent = "Accept";

      accept.onclick =
        () => acceptFriend(request.username);


      const decline =
        document.createElement("button");

      decline.className =
        "item-button danger";

      decline.textContent = "Decline";

      decline.onclick =
        () => declineFriend(request.username);


      item.appendChild(avatar);
      item.appendChild(info);
      item.appendChild(accept);
      item.appendChild(decline);

      list.appendChild(item);
    });

  } catch (errorObject) {

    console.error(errorObject);
  }
}


/* ACCEPT FRIEND */

async function acceptFriend(username) {

  try {

    await set(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/friends/" +
        key(username)
      ),
      {
        username: username,
        timestamp: Date.now()
      }
    );


    await set(
      ref(
        db,
        "users/" +
        key(username) +
        "/friends/" +
        key(currentUser)
      ),
      {
        username: currentUser,
        timestamp: Date.now()
      }
    );


    await set(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/friendRequests/" +
        key(username)
      ),
      null
    );


    loadRequests();
    loadFriends();

  } catch (errorObject) {

    console.error(errorObject);
  }
}


/* DECLINE */

async function declineFriend(username) {

  await set(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/friendRequests/" +
      key(username)
    ),
    null
  );

  loadRequests();
}


/* LOAD FRIENDS */

async function loadFriends() {

  const list =
    document.getElementById("friendsList");

  list.innerHTML = "";


  const snapshot =
    await get(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/friends"
      )
    );


  if (!snapshot.exists()) {

    list.innerHTML =
      '<div class="empty">You don\'t have any friends yet.</div>';

    return;
  }


  snapshot.forEach(child => {

    const friend =
      child.val().username;


    const item =
      document.createElement("div");

    item.className = "list-item";


    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
      friend[0].toUpperCase();


    const info =
      document.createElement("div");

    info.className = "item-info";

    info.innerHTML =
      `<div class="item-name">${escapeHTML(friend)}</div>
       <div class="item-subtitle">Friend</div>`;


    const button =
      document.createElement("button");

    button.className =
      "item-button";

    button.textContent =
      "Message";

    button.onclick =
      () => openDM(friend);


    item.appendChild(avatar);
    item.appendChild(info);
    item.appendChild(button);

    list.appendChild(item);
  });
}


/* DM ID */

function dmID(a, b) {

  const first = key(a);
  const second = key(b);

  return first < second
    ? first + "_" + second
    : second + "_" + first;
}


/* OPEN DM */

async function openDM(username) {

  currentDMUser = username;

  hideScreens();

  document.getElementById("dmScreen")
    .classList.remove("hidden");

  document.getElementById("dmTitle")
    .textContent = username;

  document.getElementById("dmMessages")
    .innerHTML = "";


  const messagesRef =
    ref(
      db,
      "directMessages/" +
      dmID(currentUser, username) +
      "/messages"
    );


  dmListener =
    onChildAdded(messagesRef, snapshot => {

      displayDM(snapshot.val());

    });


  document.getElementById("dmInput")
    .focus();
}


/* DISPLAY DM */

function displayDM(message) {

  const box =
    document.getElementById("dmMessages");


  const wrapper =
    document.createElement("div");

  wrapper.className =
    "dm-message " +
    (message.username === currentUser
      ? "mine"
      : "");


  const bubble =
    document.createElement("div");

  bubble.className = "bubble";


  const name =
    document.createElement("div");

  name.className = "bubble-name";

  name.textContent =
    message.username;


  const text =
    document.createElement("div");

  text.textContent =
    message.text;


  const time =
    document.createElement("div");

  time.className = "bubble-time";

  if (message.timestamp) {

    time.textContent =
      new Date(message.timestamp)
        .toLocaleTimeString([], {
          hour: "numeric",
          minute: "2-digit"
        });
  }


  bubble.appendChild(name);
  bubble.appendChild(text);
  bubble.appendChild(time);

  wrapper.appendChild(bubble);

  box.appendChild(wrapper);

  box.scrollTop =
    box.scrollHeight;
}


/* SEND DM */

async function sendDM() {

  const input =
    document.getElementById("dmInput");

  const text =
    input.value.trim();


  if (!text || !currentDMUser) return;


  try {

    const id =
      dmID(currentUser, currentDMUser);


    await push(
      ref(
        db,
        "directMessages/" +
        id +
        "/messages"
      ),
      {
        username: currentUser,
        text: text,
        timestamp: Date.now()
      }
    );


    await set(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/conversations/" +
        key(currentDMUser)
      ),
      {
        username: currentDMUser,
        timestamp: Date.now()
      }
    );


    await set(
      ref(
        db,
        "users/" +
        key(currentDMUser) +
        "/conversations/" +
        key(currentUser)
      ),
      {
        username: currentUser,
        timestamp: Date.now()
      }
    );


    input.value = "";
    input.focus();

    loadConversations();

  } catch (errorObject) {

    console.error(errorObject);

    document.getElementById("dmError")
      .textContent =
      "Message could not be sent.";
  }
}


/* CLOSE DM */

function closeDM() {

  currentDMUser = null;

  document.getElementById("dmInput")
    .value = "";

  showHome();
}


/* LOAD CONVERSATIONS */

async function loadConversations() {

  const list =
    document.getElementById("dmList");

  list.innerHTML = "";


  const snapshot =
    await get(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/conversations"
      )
    );


  if (!snapshot.exists()) {

    list.innerHTML =
      '<div class="empty">No direct messages yet.</div>';

    return;
  }


  const conversations = [];

  snapshot.forEach(child => {
    conversations.push(child.val());
  });


  conversations.sort(
    (a,b) =>
      (b.timestamp || 0) -
      (a.timestamp || 0)
  );


  conversations.forEach(conversation => {

    const item =
      document.createElement("div");

    item.className =
      "list-item";


    const avatar =
      document.createElement("div");

    avatar.className = "avatar";

    avatar.textContent =
      conversation.username[0].toUpperCase();


    const info =
      document.createElement("div");

    info.className = "item-info";

    info.innerHTML =
      `<div class="item-name">${escapeHTML(conversation.username)}</div>
       <div class="item-subtitle">Direct message</div>`;


    const button =
      document.createElement("button");

    button.className =
      "item-button";

    button.textContent = "Open";

    button.onclick =
      () => openDM(conversation.username);


    item.appendChild(avatar);
    item.appendChild(info);
    item.appendChild(button);

    list.appendChild(item);
  });
}


/* ROOMS */

async function joinRoom() {

  const code =
    document.getElementById("roomCode")
      .value.trim();

  const error =
    document.getElementById("roomError");


  error.textContent = "";


  if (!/^\d{4}$/.test(code)) {

    error.textContent =
      "Room code must be exactly 4 digits.";

    return;
  }


  currentRoom = code;

  hideScreens();

  document.getElementById("chatScreen")
    .classList.remove("hidden");

  document.getElementById("displayRoomCode")
    .textContent = code;

  document.getElementById("chatUsername")
    .textContent = currentUser;

  document.getElementById("messages")
    .innerHTML = "";


  const messagesRef =
    ref(
      db,
      "rooms/" +
      code +
      "/messages"
    );


  roomListener =
    onChildAdded(messagesRef, snapshot => {

      displayRoomMessage(snapshot.val());

    });


  await push(messagesRef, {

    username: "MyChat",
    text: currentUser + " joined the room.",
    system: true,
    timestamp: Date.now()

  });
}


/* ROOM MESSAGE */

function displayRoomMessage(message) {

  const box =
    document.getElementById("messages");


  const div =
    document.createElement("div");

  div.className = "message";


  const username =
    document.createElement("div");

  username.className = "username";

  username.textContent =
    message.username;


  const text =
    document.createElement("div");

  text.textContent =
    message.text;


  div.appendChild(username);
  div.appendChild(text);

  box.appendChild(div);

  box.scrollTop =
    box.scrollHeight;
}


/* SEND ROOM MESSAGE */

async function sendMessage() {

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();


  if (!text || !currentRoom) return;


  try {

    await push(
      ref(
        db,
        "rooms/" +
        currentRoom +
        "/messages"
      ),
      {
        username: currentUser,
        text: text,
        timestamp: Date.now()
      }
    );


    input.value = "";
    input.focus();

  } catch (errorObject) {

    console.error(errorObject);

    document.getElementById("chatError")
      .textContent =
      "Message could not be sent.";
  }
}


/* LEAVE ROOM */

async function leaveRoom() {

  if (currentRoom) {

    try {

      await push(
        ref(
          db,
          "rooms/" +
          currentRoom +
          "/messages"
        ),
        {
          username: "MyChat",
          text: currentUser + " left the room.",
          system: true,
          timestamp: Date.now()
        }
      );

    } catch (errorObject) {

      console.error(errorObject);
    }
  }


  currentRoom = null;

  document.getElementById("messageInput")
    .value = "";

  showHome();
}


/* LOG OUT */

function logout() {

  currentUser = null;
  currentRoom = null;
  currentDMUser = null;

  document.getElementById("loginUsername")
    .value = "";

  document.getElementById("loginPassword")
    .value = "";

  showLogin();
}


/* ESCAPE HTML */

function escapeHTML(text) {

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}
