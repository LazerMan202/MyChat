<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChat 1.6</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:white;
}

button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}

.auth-container{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.auth-box{
  width:100%;
  max-width:400px;
  background:#1f2937;
  padding:30px;
  border-radius:16px;
}

.auth-box h1{text-align:center}

.auth-box input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border:0;
  border-radius:8px;
  background:#374151;
  color:white;
}

.auth-box button{
  width:100%;
  padding:12px;
  margin-top:10px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
}

.auth-box .secondary{background:#374151}

.auth-message{
  min-height:20px;
  margin-top:8px;
  color:#f87171;
}

/* APP */

.app{
  height:100vh;
  display:flex;
  flex-direction:column;
}

.header{
  height:60px;
  background:#1f2937;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  border-bottom:1px solid #374151;
}

.header h2{margin:0}

.header button{
  background:#374151;
  border:0;
  color:white;
  padding:8px 12px;
  border-radius:8px;
}

.tabs{
  display:flex;
  background:#1f2937;
  border-bottom:1px solid #374151;
}

.tab{
  flex:1;
  padding:13px;
  border:0;
  background:transparent;
  color:#9ca3af;
}

.tab.active{
  background:#374151;
  color:white;
}

.content{
  flex:1;
  overflow:hidden;
}

.panel{
  width:100%;
  height:100%;
  overflow-y:auto;
  padding:16px;
}

.card{
  background:#1f2937;
  border-radius:12px;
  padding:16px;
  margin-bottom:12px;
}

/* AVATARS */

.avatar{
  width:40px;
  height:40px;
  border-radius:50%;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  overflow:hidden;
  flex-shrink:0;
}

.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.big-avatar{
  width:100px;
  height:100px;
  margin:0 auto 15px;
  border-radius:50%;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:38px;
  font-weight:bold;
  overflow:hidden;
}

.big-avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* FRIENDS */

.search-row{
  display:flex;
  gap:8px;
}

.search-row input{
  flex:1;
}

input,textarea{
  background:#374151;
  color:white;
  border:0;
  border-radius:8px;
  padding:10px;
}

.search-row button,
.action-button{
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
  padding:10px 14px;
}

.user-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #374151;
}

.user-row:last-child{border-bottom:0}

.user-info{
  display:flex;
  align-items:center;
  gap:10px;
}

.status{
  font-size:12px;
}

.online{color:#4ade80}
.offline{color:#9ca3af}

/* ROOMS */

.room-input{
  width:100%;
  margin-bottom:10px;
}

.room-button{
  width:100%;
  padding:12px;
  border:0;
  border-radius:8px;
  background:#2563eb;
  color:white;
}

.room-chat{
  display:flex;
  flex-direction:column;
  height:calc(100vh - 180px);
}

.room-messages{
  flex:1;
  overflow-y:auto;
  padding:10px;
  background:#111827;
  border-radius:10px;
  margin-bottom:10px;
}

.message-input-row{
  display:flex;
  gap:8px;
}

.message-input-row input{flex:1}

/* DM + GROUP LAYOUT */

.chat-layout{
  height:100%;
  display:flex;
  gap:12px;
}

.conversations{
  width:250px;
  background:#1f2937;
  border-radius:12px;
  padding:10px;
  overflow-y:auto;
}

.conversation{
  padding:10px;
  border-radius:8px;
  cursor:pointer;
  margin-bottom:5px;
  display:flex;
  align-items:center;
  gap:9px;
}

.conversation:hover,
.conversation.active{
  background:#374151;
}

.conversation-info{
  min-width:0;
  flex:1;
}

.conversation-name{
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.conversation-preview{
  color:#9ca3af;
  font-size:11px;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.unread{
  background:#2563eb;
  border-radius:999px;
  padding:2px 7px;
  font-size:11px;
}

.chat-window{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  background:#1f2937;
  border-radius:12px;
  overflow:hidden;
}

.chat-header{
  padding:10px 16px;
  border-bottom:1px solid #374151;
  font-weight:bold;
  display:flex;
  align-items:center;
  gap:10px;
}

.chat-header-info{
  min-width:0;
}

.chat-header-sub{
  color:#9ca3af;
  font-size:11px;
  font-weight:normal;
}

.chat-messages{
  flex:1;
  overflow-y:auto;
  padding:14px;
}

/* MESSAGES */

.message-row{
  display:flex;
  gap:8px;
  margin-bottom:12px;
  align-items:flex-start;
}

.message-row.mine{
  flex-direction:row-reverse;
}

.message-content{
  max-width:75%;
}

.message-bubble{
  background:#374151;
  border-radius:12px;
  padding:10px;
}

.message-row.mine .message-bubble{
  background:#2563eb;
}

.message-author{
  font-size:12px;
  font-weight:bold;
  margin-bottom:4px;
}

.message-time{
  font-size:10px;
  color:#9ca3af;
  margin-top:4px;
}

.edited{
  font-size:10px;
  color:#9ca3af;
  margin-left:4px;
}

.message-actions{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:6px;
}

.message-actions button{
  background:#374151;
  color:#d1d5db;
  border:0;
  border-radius:6px;
  padding:4px 7px;
  font-size:11px;
}

.message-row.mine .message-actions button{
  background:#1d4ed8;
}

/* REPLIES */

.replying-bar{
  background:#374151;
  border-left:4px solid #3b82f6;
  padding:8px 10px;
  margin-bottom:8px;
  border-radius:6px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.replying-text{min-width:0}

.replying-title{
  font-size:12px;
  color:#60a5fa;
  font-weight:bold;
}

.replying-preview{
  font-size:13px;
  color:#d1d5db;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.cancel-reply{
  background:transparent;
  border:0;
  color:#9ca3af;
  font-size:18px;
}

.message-reply{
  background:rgba(0,0,0,.2);
  border-left:3px solid #60a5fa;
  padding:6px 8px;
  margin-bottom:7px;
  border-radius:5px;
  cursor:pointer;
}

.message-reply-author{
  color:#60a5fa;
  font-size:11px;
  font-weight:bold;
}

.message-reply-text{
  color:#d1d5db;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* REACTIONS */

.reactions{
  display:flex;
  flex-wrap:wrap;
  gap:4px;
  margin-top:6px;
}

.reaction{
  border:0;
  border-radius:999px;
  padding:3px 7px;
  background:#111827;
  color:white;
  font-size:12px;
}

.reaction-picker{
  display:flex;
  flex-wrap:wrap;
  gap:3px;
  background:#111827;
  padding:5px;
  border-radius:8px;
  margin-top:5px;
}

.reaction-picker button{
  background:transparent!important;
  font-size:16px!important;
  padding:4px!important;
}

/* PROFILE */

.profile-card input,
.profile-card textarea{
  width:100%;
  margin-bottom:10px;
}

.profile-card textarea{
  min-height:100px;
  resize:vertical;
}

.save-profile{
  width:100%;
  padding:12px;
  background:#2563eb;
  border:0;
  color:white;
  border-radius:8px;
}

.file-button{
  display:block;
  width:100%;
  text-align:center;
  padding:10px;
  background:#374151;
  border-radius:8px;
  margin-bottom:12px;
  cursor:pointer;
}

.file-button input{display:none}

/* GROUP CREATION */

.member-picker{
  max-height:250px;
  overflow-y:auto;
  margin-top:10px;
}

.member-option{
  display:flex;
  align-items:center;
  gap:10px;
  padding:8px;
  border-radius:8px;
}

.member-option:hover{
  background:#374151;
}

.member-option input{
  width:18px;
  height:18px;
}

/* GROUP INFO */

.group-info{
  padding:12px;
  border-bottom:1px solid #374151;
}

.group-member{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px 0;
}

/* HIGHLIGHT */

.highlight{
  animation:highlightMessage 1.5s ease;
}

@keyframes highlightMessage{
  0%{background:rgba(59,130,246,.5)}
  100%{background:transparent}
}

/* MOBILE */

@media(max-width:700px){

  .chat-layout{
    flex-direction:column;
  }

  .conversations{
    width:100%;
    max-height:170px;
  }

  .chat-window{
    min-height:400px;
  }

  .message-content{
    max-width:85%;
  }

}
</style>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  push,
  remove,
  onChildAdded,
  onChildChanged,
  onChildRemoved,
  onDisconnect
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyDFun3M-6mzjBL8DFcfmJzDv7blNODQd0",
  authDomain: "mychat-8dac2.firebaseapp.com",
  databaseURL: "https://mychat-8dac2-default-rtdb.firebaseio.com",
  projectId: "mychat-8dac2",
  storageBucket: "mychat-8dac2.firebasestorage.app",
  messagingSenderId: "906137277444",
  appId: "1:906137277444:web:b9d52ef4ec1f76afe09151"
};

const firebaseApp =
  initializeApp(firebaseConfig);

const db =
  getDatabase(firebaseApp);


/* STATE */

let currentUser = null;

let currentChat = null;
let currentChatType = null;

let stopChatListener = null;
let stopRoomListener = null;

let currentReply = null;


/* HELPERS */

function key(username){
  return username.toLowerCase();
}

function conversationId(a,b){
  return [key(a),key(b)].sort().join("_");
}

async function hashPassword(password){

  const data =
    new TextEncoder().encode(password);

  const hash =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );

  return [...new Uint8Array(hash)]
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");
}

function escapeHTML(text){

  const div =
    document.createElement("div");

  div.textContent =
    text ?? "";

  return div.innerHTML;
}

function formatTime(timestamp){

  if(!timestamp) return "";

  return new Date(timestamp).toLocaleString([],{
    month:"short",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}


/* PROFILE PICTURE COMPRESSION */

function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader =
      new FileReader();

    reader.onload = event => {

      const img =
        new Image();

      img.onload = () => {

        const maxSize = 256;

        let width = img.width;
        let height = img.height;

        if(width > height){

          if(width > maxSize){
            height =
              height * maxSize / width;

            width = maxSize;
          }

        }else{

          if(height > maxSize){
            width =
              width * maxSize / height;

            height = maxSize;
          }
        }

        const canvas =
          document.createElement("canvas");

        canvas.width =
          Math.round(width);

        canvas.height =
          Math.round(height);

        const ctx =
          canvas.getContext("2d");

        ctx.drawImage(
          img,
          0,
          0,
          canvas.width,
          canvas.height
        );

        resolve(
          canvas.toDataURL(
            "image/jpeg",
            .75
          )
        );
      };

      img.onerror =
        () => reject();

      img.src =
        event.target.result;
    };

    reader.onerror =
      () => reject();

    reader.readAsDataURL(file);
  });
}


/* AVATAR HTML */

function avatarHTML(user,size="avatar"){

  const picture =
    user?.profilePicture;

  if(picture){

    return `
      <div class="${size}">
        <img src="${picture}" alt="">
      </div>
    `;
  }

  const name =
    user?.displayName ||
    user?.username ||
    "?";

  return `
    <div class="${size}">
      ${escapeHTML(name[0]?.toUpperCase() || "?")}
    </div>
  `;
}


/* AUTH */

function showLogin(){

  document.getElementById("loginBox")
    .classList.remove("hidden");

  document.getElementById("createBox")
    .classList.add("hidden");
}

function showCreate(){

  document.getElementById("loginBox")
    .classList.add("hidden");

  document.getElementById("createBox")
    .classList.remove("hidden");
}

document.getElementById("showCreateButton")
.addEventListener("click",showCreate);

document.getElementById("showLoginButton")
.addEventListener("click",showLogin);


/* CREATE ACCOUNT */

async function createAccount(){

  const username =
    document.getElementById("createUsername")
      .value.trim();

  const password =
    document.getElementById("createPassword")
      .value;

  const message =
    document.getElementById("createMessage");

  message.textContent = "";

  if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){

    message.textContent =
      "Username must be 3–20 characters and use only letters, numbers, or _.";

    return;
  }

  if(password.length < 4){

    message.textContent =
      "Password must be at least 4 characters.";

    return;
  }

  const userKey =
    key(username);

  const existing =
    await get(
      ref(db,`users/${userKey}`)
    );

  if(existing.exists()){

    message.textContent =
      "That username already exists.";

    return;
  }

  const passwordHash =
    await hashPassword(password);

  await set(
    ref(db,`users/${userKey}`),
    {
      username,
      passwordHash,
      displayName:username,
      bio:"",
      online:false,
      profilePicture:""
    }
  );

  message.style.color =
    "#4ade80";

  message.textContent =
    "Account created! You can now log in.";

/* LOGIN */

async function login(){

  const username =
    document.getElementById("loginUsername")
      .value.trim();

  const password =
    document.getElementById("loginPassword")
      .value;

  const message =
    document.getElementById("loginMessage");

  message.textContent="";

  if(!username || !password){

    message.textContent =
      "Enter your username and password.";

    return;
  }

  const userKey =
    key(username);

  const snapshot =
    await get(
      ref(db,`users/${userKey}`)
    );

  if(!snapshot.exists()){

    message.textContent =
      "Username or password is incorrect.";

    return;
  }

  const data =
    snapshot.val();

  const passwordHash =
    await hashPassword(password);

  if(data.passwordHash !== passwordHash){

    message.textContent =
      "Username or password is incorrect.";

    return;
  }

  currentUser = {
    key:userKey,
    username:data.username
  };

  await set(
    ref(db,`users/${userKey}/online`),
    true
  );

  onDisconnect(
    ref(db,`users/${userKey}/online`)
  ).set(false);

  showHome();
}

document.getElementById("loginButton")
.addEventListener("click",login);

document.getElementById("loginPassword")
.addEventListener("keydown",e=>{
  if(e.key==="Enter") login();
});

document.getElementById("createPassword")
.addEventListener("keydown",e=>{
  if(e.key==="Enter") createAccount();
});

async function searchFriend(){

    document.getElementById("friendSearch")
      .value.trim();

  const result =
    document.getElementById("friendSearchResult");

  result.innerHTML="";

  if(!username) return;

  const snapshot =
    await get(
      ref(db,`users/${key(username)}`)
    );

  if(!snapshot.exists()){

    result.innerHTML =
      `<p style="color:#9ca3af;">User not found.</p>`;

    return;
  }

  if(key(username)===currentUser.key){

    result.innerHTML =
      `<p style="color:#9ca3af;">That's you!</p>`;

    return;
  }

  const friend =
    await get(
      ref(
        db,
        `users/${currentUser.key}/friends/${key(username)}`
      )
    );

  if(friend.exists()){

    result.innerHTML =
      `<p style="color:#4ade80;">Already friends.</p>`;

    return;
  }

  const button =
    document.createElement("button");

  button.className =
    "action-button";

  button.textContent =
    `Add ${snapshot.val().username}`;

  button.addEventListener("click",async()=>{

    await set(
      ref(
        db,
        `users/${key(username)}/friendRequests/${currentUser.key}`
      ),
      {
        username:currentUser.username,
        timestamp:Date.now()
      }
    );

    result.innerHTML =
      `<p style="color:#4ade80;">Friend request sent!</p>`;
  });

async function loadConversations(){

    );


  const unreadSnapshot =
    await get(
      ref(

      ? unreadSnapshot.val()

        document.createElement("div");

      row.className =
        "conversation";

      row.innerHTML=`

            group.name?.[0]?.toUpperCase() ||

        ${
          unread["group_"+groupId]
            ? `<span class="unread">

        }

    !groupSnapshot.exists()

      `<p style="color:#9ca3af;padding:8px;">
        No chats yet.
      </p>`;

/* RENDER MESSAGE */

function renderMessage(
  container,
  id,
  data,
  messageMap,
  messagePath
){

  let element =
    messageMap.get(id);

  if(!element){

    element =
      document.createElement("div");

    messageMap.set(id,element);

    container.appendChild(element);
  }

  const mine =
    data.username === currentUser.username;

  element.className =
    "message-row " +
    (mine ? "mine" : "");

  element.dataset.id=id;


  /* REACTIONS */

  let reactionsHTML="";

  if(data.reactions){

    const counts={};

    Object.values(data.reactions)
    .forEach(emoji=>{
      counts[emoji]=(counts[emoji]||0)+1;
    });

    reactionsHTML=`
      <div class="reactions">
        ${
          Object.entries(counts)
          .map(([emoji,count])=>`
            <button
              class="reaction"
              data-reaction="${emoji}"
            >
              ${emoji} ${count}
            </button>
          `)
          .join("")
        }
      </div>
    `;
  }


  /* REPLY */

  const replyHTML =
    data.replyTo
      ? `
        <div
          class="message-reply"
          data-reply-id="${escapeHTML(data.replyTo.id)}"
        >

          <div class="message-reply-author">
            ↩ ${escapeHTML(data.replyTo.username)}
          </div>

          <div class="message-reply-text">
            ${escapeHTML(data.replyTo.text)}
          </div>

        </div>
      `
      : "";


  element.innerHTML=`

    ${avatarHTML(data)}

    <div class="message-content">

      <div class="message-bubble">

        ${
          !mine
            ? `<div class="message-author">
                ${escapeHTML(data.username)}
              </div>`
            : ""
        }

        ${replyHTML}

        <div>
          ${escapeHTML(data.text)}

          ${
            data.edited
              ? `<span class="edited">(edited)</span>`
              : ""
          }
        </div>

        <div class="message-time">
          ${formatTime(data.timestamp)}
        </div>

      </div>


      <div class="message-actions">

        <button class="reply-button">
          ↩ Reply
        </button>

        <button class="copy-button">
          📋 Copy
        </button>

        <button class="reaction-button">
          😊 React
        </button>

        ${
          mine
            ? `
              <button class="edit-button">
                ✏️ Edit
              </button>

              <button class="delete-button">
                🗑 Delete
              </button>
            `
            : ""
        }

      </div>

      <div class="reaction-area"></div>

      ${reactionsHTML}

    </div>
  `;


  /* REPLY */

  element.querySelector(".reply-button")
  .addEventListener("click",()=>{

    setReply(data,id);
  });


  /* COPY */

  element.querySelector(".copy-button")
  .addEventListener("click",async()=>{

    try{

      await navigator.clipboard
        .writeText(data.text);

      const button =
        element.querySelector(".copy-button");

      button.textContent="✅ Copied!";

      setTimeout(()=>{
        button.textContent="📋 Copy";
      },1200);

    }catch{

      alert("Couldn't copy the message.");
    }
  });


  /* REACTION PICKER */

  element.querySelector(".reaction-button")
  .addEventListener("click",()=>{

    const area =
      element.querySelector(".reaction-area");

    if(area.innerHTML){

      area.innerHTML="";
      return;
    }

    const picker =
      document.createElement("div");

    picker.className =
      "reaction-picker";

    [
      "👍",
      "❤️",
      "😂",
      "😮",
      "😢",
      "😡",
      "🔥",
      "🎉",
      "👏",
      "💯"
    ].forEach(emoji=>{

      const button =
        document.createElement("button");

      button.textContent=emoji;

      button.addEventListener(
        "click",
        async()=>{

          await set(
            ref(
              db,
              `${messagePath}/reactions/${currentUser.key}`
            ),
            emoji
          );

          area.innerHTML="";
        }
      );

      picker.appendChild(button);
    });

    area.appendChild(picker);
  });


  /* EDIT */

  const editButton =
    element.querySelector(".edit-button");

  if(editButton){

    editButton.addEventListener(
      "click",
      async()=>{

        const newText =
          prompt(
            "Edit your message:",
            data.text
          );

        if(
          newText===null ||
          !newText.trim()
        ) return;

        await set(
          ref(db,`${messagePath}/text`),
          newText.trim()
        );

        await set(
          ref(db,`${messagePath}/edited`),
          true
        );
      }
    );
  }


  /* DELETE */

  const deleteButton =
    element.querySelector(".delete-button");

  if(deleteButton){

    deleteButton.addEventListener(
      "click",
      async()=>{

        await remove(
          ref(db,messagePath)
        );
      }
    );
  }


  /* REPLY PREVIEW */

  const replyPreview =
    element.querySelector(".message-reply");

  if(replyPreview){

    replyPreview.addEventListener(
      "click",
      ()=>{

        const target =
          messageMap.get(
            replyPreview.dataset.replyId
          );

        if(!target) return;

        target.scrollIntoView({
          behavior:"smooth",
          block:"center"
        });

        target.classList.remove("highlight");

        void target.offsetWidth;

        target.classList.add("highlight");
      }
    );
  }


  /* EXISTING REACTIONS */

  element.querySelectorAll(".reaction")
  .forEach(button=>{

    button.addEventListener(
      "click",
      async()=>{

        await set(
          ref(
            db,
            `${messagePath}/reactions/${currentUser.key}`
          ),
          button.dataset.reaction
        );
      }
    );
  });
}


/* OPEN DM */

async function openDM(username){

  stopCurrentChatListener();

  cancelReply();

  currentChat=username;
  currentChatType="dm";

  document.getElementById("chatHeader")
    .innerHTML=`
      <div class="avatar">
        ${escapeHTML(username[0]?.toUpperCase()||"?")}
      </div>

      <div class="chat-header-info">
        ${escapeHTML(username)}
        <div class="chat-header-sub">
          Direct message
        </div>
      </div>
    `;

  document.getElementById("chatExtra")
    .innerHTML="";

  const container =
    document.getElementById("chatMessages");

  container.innerHTML="";

  const convoId =
    conversationId(
      currentUser.username,
      username
    );

  await set(
    ref(
      db,
      `users/${currentUser.key}/unread/${key(username)}`
    ),
    0
  );

  const otherSnapshot =
    await get(
      ref(db,`users/${key(username)}`)
    );

  if(otherSnapshot.exists()){

    const other =
      otherSnapshot.val();

    await set(
      ref(
        db,
        `users/${currentUser.key}/conversations/${key(username)}`
      ),
      {
        username:other.username,
        displayName:
          other.displayName ||
          other.username,
        profilePicture:
          other.profilePicture ||
          ""
      }
    );
  }

  loadConversations();


  const messagesRef =
    ref(
      db,
      `directMessages/${convoId}/messages`
    );

  const messageMap =
    new Map();

  const unsubAdded =
    onChildAdded(
      messagesRef,
      snapshot=>{

        renderMessage(
          container,
          snapshot.key,
          snapshot.val(),
          messageMap,
          `directMessages/${convoId}/messages/${snapshot.key}`
        );

        container.scrollTop =
          container.scrollHeight;
      }
    );

  const unsubChanged =
    onChildChanged(
      messagesRef,
      snapshot=>{

        renderMessage(
          container,
          snapshot.key,
          snapshot.val(),
          messageMap,
          `directMessages/${convoId}/messages/${snapshot.key}`
        );
      }
    );

  const unsubRemoved =
    onChildRemoved(
      messagesRef,
      snapshot=>{

        const element =
          messageMap.get(snapshot.key);

        if(element){

          element.remove();

          messageMap.delete(
            snapshot.key
          );
        }
      }
    );

  stopChatListener=()=>{

    unsubAdded();
    unsubChanged();
    unsubRemoved();

    messageMap.clear();
  };
}

  if(!currentChat) return;

  const input =
    document.getElementById("chatInput");

  const text =
    input.value.trim();

  if(!text) return;


  const message={
    username:currentUser.username,
    text,
    timestamp:Date.now()
  };


  if(currentReply){

    message.replyTo={
      id:currentReply.id,
      username:currentReply.username,
      text:currentReply.text
    };
  }


  if(currentChatType==="dm"){

    const convoId =
      conversationId(
        currentUser.username,
        currentChat
      );

    await push(
      ref(
        db,
        `directMessages/${convoId}/messages`
      ),
      message
    );


    await set(
      ref(
        db,
        `users/${currentUser.key}/conversations/${key(currentChat)}`
      ),
      {
        username:currentChat,
        displayName:currentChat
      }
    );


    await set(
      ref(
        db,
        `users/${key(currentChat)}/conversations/${currentUser.key}`
      ),
      {
        username:currentUser.username,
        displayName:currentUser.username
      }
    );


    const unreadRef =
      ref(
        db,
        `users/${key(currentChat)}/unread/${currentUser.key}`
      );

    const unreadSnapshot =
      await get(unreadRef);

    const unread =
      unreadSnapshot.exists()
        ? unreadSnapshot.val()
        : 0;

    await set(
      unreadRef,
      unread+1
    );

  }


  else if(currentChatType==="group"){

    const groupSnapshot =
      await get(
        ref(
          db,
          `groupChats/${currentChat}`
        )
      );

    if(!groupSnapshot.exists()) return;

    const group =
      groupSnapshot.val();

    await push(
      ref(
        db,
        `groupChats/${currentChat}/messages`
      ),
      message
    );


    /* INCREASE UNREAD FOR OTHER MEMBERS */

    for(const memberKey of Object.keys(
      group.members || {}
    )){

      if(memberKey===currentUser.key)
        continue;

      const unreadRef =
        ref(
          db,
          `users/${memberKey}/unread/group_${currentChat}`
        );

      const snapshot =
        await get(unreadRef);

      const unread =
        snapshot.exists()
          ? snapshot.val()
          : 0;

      await set(
        unreadRef,
        unread+1
      );
    }
  }


  input.value="";

  cancelReply();

  loadConversations();
}

document.getElementById("sendChatButton")
.addEventListener("click",sendChat);

document.getElementById("chatInput")
.addEventListener("keydown",e=>{

  if(
    e.key==="Enter" &&
    !e.shiftKey
  ){

    e.preventDefault();

    sendChat();
  }
});


/* CREATE GROUP */

document.getElementById("createGroupButton")
.addEventListener("click",async()=>{

  const modal =
    document.getElementById("groupModal");

  const membersContainer =
    document.getElementById("groupMembers");

  membersContainer.innerHTML="";

  document.getElementById("groupNameInput")
    .value="";

  document.getElementById("groupError")
    .textContent="";


  const snapshot =
    await get(
      ref(
        db,
        `users/${currentUser.key}/friends`
      )
    );


  if(!snapshot.exists()){

    membersContainer.innerHTML=`
      <p style="color:#9ca3af;">
        Add some friends first.
      </p>
    `;

  }else{

    for(const friendKey of Object.keys(snapshot.val())){

      const friendSnapshot =
        await get(
          ref(db,`users/${friendKey}`)
        );

      if(!friendSnapshot.exists())
        continue;

      const friend =
        friendSnapshot.val();

      const label =
        document.createElement("label");

      label.className =
        "member-option";

      label.innerHTML=`

        <input
          type="checkbox"
          value="${escapeHTML(friendKey)}"
        >

        ${avatarHTML(friend)}

        <span>
          ${escapeHTML(
            friend.displayName ||
            friend.username
          )}
        </span>
      `;

      membersContainer.appendChild(label);
    }
  }

  modal.classList.remove("hidden");
});


/* CANCEL GROUP */

document.getElementById("cancelGroupButton")
.addEventListener("click",()=>{

  document.getElementById("groupModal")
    .classList.add("hidden");
});


/* CONFIRM GROUP */

document.getElementById("confirmGroupButton")
.addEventListener("click",async()=>{

  const name =
    document.getElementById("groupNameInput")
      .value.trim();

  const error =
    document.getElementById("groupError");

  error.textContent="";


  if(!name){

    error.textContent =
      "Enter a group name.";

    return;
  }


  const selected =
    [...document.querySelectorAll(
      "#groupMembers input:checked"
    )]
    .map(input=>input.value);


  if(selected.length===0){

    error.textContent =
      "Select at least one friend.";

    return;
  }


  const groupRef =
    push(
      ref(db,"groupChats")
    );

  const groupId =
    groupRef.key;


  const members={
    [currentUser.key]:true
  };


  selected.forEach(friendKey=>{
    members[friendKey]=true;
  });


  await set(
    groupRef,
    {
      name,
      creator:currentUser.username,
      members,
      createdAt:Date.now()
    }
  );


  /* ADD GROUP TO EVERY MEMBER'S CHAT LIST */

  for(const memberKey of Object.keys(members)){

    await set(
      ref(
        db,
        `users/${memberKey}/groups/${groupId}`
      ),
      {
        name
      }
    );
  }


  document.getElementById("groupModal")
    .classList.add("hidden");

  loadConversations();

  openGroup(
    groupId,
    {
      name,
      creator:currentUser.username,
      members
    }
  );
});


/* PROFILE */

let selectedProfilePicture = null;


async function loadProfile(){

  const snapshot =
    await get(
      ref(
        db,
        `users/${currentUser.key}`
      )
    );

  if(!snapshot.exists()) return;

  const data =
    snapshot.val();

  document.getElementById("profileUsername")
    .textContent=currentUser.username;

  document.getElementById("displayNameInput")
    .value=
      data.displayName ||
      data.username;

  document.getElementById("bioInput")
    .value=
      data.bio || "";


  selectedProfilePicture =
    data.profilePicture || null;

  updateProfileAvatar(data);
}


function updateProfileAvatar(data){

  const avatar =
    document.getElementById("profileAvatar");

  const picture =
    data.profilePicture ||
    selectedProfilePicture;

  const name =
    data.displayName ||
    data.username ||
    currentUser.username;


  if(picture){

    avatar.innerHTML =
      `<img src="${picture}" alt="">`;

  }else{

    avatar.innerHTML =
      escapeHTML(
        name[0]?.toUpperCase() || "?"
      );
  }
}


/* SELECT PICTURE */

document.getElementById("profilePictureInput")
.addEventListener("change",async e=>{

  const file =
    e.target.files[0];

  if(!file) return;


  if(!file.type.startsWith("image/")){

    alert("Please choose an image.");

    return;
  }


  try{

    selectedProfilePicture =
      await compressImage(file);

    updateProfileAvatar({
      displayName:
        document.getElementById("displayNameInput")
          .value ||
        currentUser.username,
      username:currentUser.username
    });

    document.getElementById("profileMessage")
      .textContent=
        "Picture selected. Save your profile to apply it.";

  }catch{

    alert("Couldn't process that image.");
  }
});


/* REMOVE PICTURE */

document.getElementById("removePictureButton")
.addEventListener("click",()=>{

  selectedProfilePicture=null;

  updateProfileAvatar({
    displayName:
      document.getElementById("displayNameInput")
        .value ||
      currentUser.username,
    username:currentUser.username
  });

  document.getElementById("profileMessage")
    .textContent=
      "Picture removed. Save your profile to apply it.";
});


/* SAVE PROFILE */

document.getElementById("saveProfileButton")
.addEventListener("click",async()=>{

  const displayName =
    document.getElementById("displayNameInput")
      .value.trim();

  const bio =
    document.getElementById("bioInput")
      .value.trim();

  const finalName =
    displayName ||
    currentUser.username;


  await set(
    ref(
      db,
      `users/${currentUser.key}/displayName`
    ),
    finalName
  );


  await set(
    ref(
      db,
      `users/${currentUser.key}/bio`
    ),
    bio
  );


  await set(
    ref(
      db,
      `users/${currentUser.key}/profilePicture`
    ),
    selectedProfilePicture || ""
  );


  updateProfileAvatar({
    displayName:finalName,
    username:currentUser.username,
    profilePicture:
      selectedProfilePicture
  });


  document.getElementById("profileMessage")
    .style.color="#4ade80";

  document.getElementById("profileMessage")
    .textContent=
      "Profile saved!";

  loadFriends();
  loadConversations();


  setTimeout(()=>{

    document.getElementById("profileMessage")
      .textContent="";

  },1500);
});


/* ROOMS */

document.getElementById("joinRoomButton")
.addEventListener("click",joinRoom);


async function joinRoom(){

  const code =
    document.getElementById("roomCode")
      .value.trim();

  const message =
    document.getElementById("roomMessage");

  message.textContent="";


  if(!/^\d{4}$/.test(code)){

    message.textContent =
      "Room code must be exactly 4 digits.";

    return;
  }


  if(stopRoomListener){

    stopRoomListener();
    stopRoomListener=null;
  }


  currentRoom=code;


  document.getElementById("roomJoin")
    .classList.add("hidden");

  document.getElementById("roomChat")
    .classList.remove("hidden");

  document.getElementById("currentRoomDisplay")
    .textContent=code;


  const messagesRef =
    ref(
      db,
      `rooms/${code}/messages`
    );

  const container =
    document.getElementById("roomMessages");

  container.innerHTML="";


  const unsub =
    onChildAdded(
      messagesRef,
      snapshot=>{

        const data =
          snapshot.val();

        const div =
          document.createElement("div");

        div.style.marginBottom="8px";

        div.innerHTML=`

          <strong>
            ${escapeHTML(data.username)}
          </strong>:

          ${escapeHTML(data.text)}

          <div style="font-size:10px;color:#9ca3af;">
            ${formatTime(data.timestamp)}
          </div>
        `;

        container.appendChild(div);

        container.scrollTop =
          container.scrollHeight;
      }
    );


  stopRoomListener=unsub;
}


async function sendRoomMessage(){

  if(!currentRoom) return;

  const input =
    document.getElementById("roomInput");

  const text =
    input.value.trim();

  if(!text) return;


  await push(
    ref(
      db,
      `rooms/${currentRoom}/messages`
    ),
    {
      username:currentUser.username,
      text,
      timestamp:Date.now()
    }
  );


  input.value="";
}

document.getElementById("sendRoomButton")
.addEventListener("click",sendRoomMessage);

document.getElementById("roomInput")
.addEventListener("keydown",e=>{

  if(e.key==="Enter")
    sendRoomMessage();
});


/* LEAVE ROOM */

document.getElementById("leaveRoomButton")
.addEventListener("click",()=>{

  if(stopRoomListener){

    stopRoomListener();
    stopRoomListener=null;
  }

  currentRoom=null;

  document.getElementById("roomJoin")
    .classList.remove("hidden");

  document.getElementById("roomChat")
    .classList.add("hidden");

  document.getElementById("roomMessages")
    .innerHTML="";
});


/* LOGOUT */

document.getElementById("logoutButton")
.addEventListener("click",async()=>{

  if(!currentUser) return;


  await set(
    ref(
      db,
      `users/${currentUser.key}/online`
    ),
    false
  );


  stopCurrentChatListener();


  if(stopRoomListener){

    stopRoomListener();
    stopRoomListener=null;
  }


  currentUser=null;
  currentChat=null;
  currentChatType=null;
  currentRoom=null;


  cancelReply();


  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("authScreen")
    .classList.remove("hidden");


  document.getElementById("loginUsername")
    .value="";

  document.getElementById("loginPassword")
    .value="";

  document.getElementById("loginMessage")
    .textContent="";


  showLogin();
});

</script>
