<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChat</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

.container {
  max-width: 700px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #1f2937;
  border-radius: 16px;
  padding: 22px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

h1 {
  text-align: center;
  margin-top: 0;
}

h2 {
  margin-top: 0;
}

input,
textarea {
  width: 100%;
  padding: 13px;
  margin: 7px 0;
  border: 0;
  border-radius: 8px;
  background: #374151;
  color: white;
  font-size: 16px;
  font-family: Arial, sans-serif;
}

textarea {
  resize: vertical;
  min-height: 90px;
}

button {
  width: 100%;
  padding: 13px;
  margin-top: 9px;
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

.secondary {
  background: #374151;
}

.secondary:hover {
  background: #4b5563;
}

.danger {
  background: #dc2626;
}

.danger:hover {
  background: #b91c1c;
}

.hidden {
  display: none !important;
}

.error {
  color: #f87171;
  text-align: center;
  margin-top: 10px;
}

.success {
  color: #4ade80;
  text-align: center;
  margin-top: 10px;
}

.small-text {
  text-align: center;
  color: #9ca3af;
  font-size: 14px;
  margin-top: 15px;
}

.link-button {
  width: auto;
  background: none;
  color: #60a5fa;
  padding: 0;
  margin: 5px 0 0;
  font-weight: normal;
}

.tabs {
  display: flex;
  gap: 8px;
  margin-bottom: 18px;
}

.tabs button {
  margin: 0;
  background: #374151;
}

.tabs button.active {
  background: #2563eb;
}

.account-info {
  text-align: center;
  color: #9ca3af;
  margin-bottom: 15px;
}

.section-title {
  color: #9ca3af;
  margin-top: 22px;
  margin-bottom: 8px;
}

.list-item {
  display: flex;
  align-items: center;
  gap: 10px;
  background: #374151;
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
}

.avatar {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #2563eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  flex-shrink: 0;
}

.avatar.online {
  box-shadow: 0 0 0 3px #22c55e;
}

.item-info {
  flex: 1;
  min-width: 0;
}

.item-name {
  font-weight: bold;
}

.item-subtitle {
  color: #9ca3af;
  font-size: 13px;
  margin-top: 3px;
}

.online-text {
  color: #4ade80;
}

.item-button {
  width: auto;
  padding: 8px 12px;
  margin: 0;
  font-size: 13px;
}

.empty {
  text-align: center;
  color: #9ca3af;
  padding: 20px;
}

.badge {
  background: #ef4444;
  border-radius: 20px;
  min-width: 23px;
  height: 23px;
  padding: 3px 7px;
  text-align: center;
  font-size: 12px;
  font-weight: bold;
}

.dm-header,
.room-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.dm-header button,
.room-header button {
  width: auto;
  margin: 0;
  padding: 8px 12px;
}

.dm-header h2,
.room-header h2 {
  flex: 1;
  margin: 0;
}

#dmMessages,
#messages {
  height: 400px;
  overflow-y: auto;
  background: #111827;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 12px;
}

.dm-message {
  display: flex;
  margin-bottom: 10px;
}

.dm-message.mine {
  justify-content: flex-end;
}

.bubble {
  max-width: 75%;
  padding: 10px 13px;
  border-radius: 15px;
  background: #374151;
  position: relative;
}

.mine .bubble {
  background: #2563eb;
}

.bubble-name {
  font-size: 12px;
  color: #9ca3af;
  margin-bottom: 3px;
}

.mine .bubble-name {
  color: #dbeafe;
}

.bubble-time {
  font-size: 10px;
  color: #9ca3af;
  margin-top: 5px;
}

.mine .bubble-time {
  color: #bfdbfe;
}

.delete-message {
  background: none;
  color: #fca5a5;
  font-size: 11px;
  padding: 2px;
  margin: 3px 0 0;
  width: auto;
}

.message {
  background: #374151;
  border-radius: 10px;
  padding: 9px 11px;
  margin-bottom: 10px;
}

.message .username {
  color: #60a5fa;
  font-weight: bold;
  margin-bottom: 3px;
}

.send-row {
  display: flex;
  gap: 8px;
}

.send-row input {
  flex: 1;
  margin: 0;
}

.send-row button {
  width: auto;
  margin: 0;
}

.profile-box {
  background: #374151;
  border-radius: 12px;
  padding: 18px;
  text-align: center;
  margin-bottom: 15px;
}

.big-avatar {
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: #2563eb;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 10px;
  font-size: 30px;
  font-weight: bold;
}

.profile-username {
  font-size: 21px;
  font-weight: bold;
}

.profile-status {
  color: #4ade80;
  font-size: 14px;
  margin-top: 5px;
}

.profile-bio {
  color: #d1d5db;
  margin-top: 12px;
  white-space: pre-wrap;
}

.settings-box {
  background: #374151;
  border-radius: 12px;
  padding: 15px;
}

.divider {
  height: 1px;
  background: #4b5563;
  margin: 18px 0;
}
</style>
</head>

<body>

<script type="module">

import {
  initializeApp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  push,
  remove,
  onChildAdded,
  onValue,
  onDisconnect,
  serverTimestamp
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {

  apiKey:
  "AIzaSyDFun3M-6mzjBL8DFcfmJzDv7blNODQd0",

  authDomain:
  "mychat-8dac2.firebaseapp.com",

  databaseURL:
  "https://mychat-8dac2-default-rtdb.firebaseio.com",

  projectId:
  "mychat-8dac2",

  storageBucket:
  "mychat-8dac2.firebasestorage.app",

  messagingSenderId:
  "906137277444",

  appId:
  "1:906137277444:web:b9d52ef4ec1f76afe09151"

};

const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);


/* STATE */

let currentUser = null;
let currentRoom = null;
let currentDMUser = null;

let stopDMListener = null;
let stopRoomListener = null;
let stopOnlineListener = null;


/* HELPERS */

function key(username) {

  return username.toLowerCase();

}


function hideScreens() {

  document
  .getElementById("loginScreen")
  .classList.add("hidden");

  document
  .getElementById("createScreen")
  .classList.add("hidden");

  document
  .getElementById("homeScreen")
  .classList.add("hidden");

  document
  .getElementById("dmScreen")
  .classList.add("hidden");

  document
  .getElementById("chatScreen")
  .classList.add("hidden");

}


/* PASSWORD HASH */

async function hashPassword(password) {

  const data =
  new TextEncoder().encode(password);

  const hash =
  await crypto.subtle.digest(
    "SHA-256",
    data
  );

  return Array
    .from(new Uint8Array(hash))
    .map(
      x =>
      x.toString(16).padStart(2, "0")
    )
    .join("");

}


/* LOGIN / CREATE SCREENS */

function showLogin() {

  hideScreens();

  document
  .getElementById("loginScreen")
  .classList.remove("hidden");

}


function showCreate() {

  hideScreens();

  document
  .getElementById("createScreen")
  .classList.remove("hidden");

}


/* CREATE ACCOUNT */

async function createAccount() {

  const username =
  document
  .getElementById("createUsername")
  .value
  .trim();

  const password =
  document
  .getElementById("createPassword")
  .value;

  const confirm =
  document
  .getElementById("confirmPassword")
  .value;

  const error =
  document
  .getElementById("createError");

  const success =
  document
  .getElementById("createSuccess");

  error.textContent = "";
  success.textContent = "";

  if (username.length < 3) {

    error.textContent =
    "Username must be at least 3 characters.";

    return;
  }

  if (!/^[a-zA-Z0-9_]+$/.test(username)) {

    error.textContent =
    "Username can only contain letters, numbers, and _.";

    return;
  }

  if (password.length < 4) {

    error.textContent =
    "Password must be at least 4 characters.";

    return;
  }

  if (password !== confirm) {

    error.textContent =
    "Passwords do not match.";

    return;
  }


  try {

    const usernameKey =
    key(username);

    const userRef =
    ref(
      db,
      "users/" + usernameKey
    );

    const existing =
    await get(userRef);

    if (existing.exists()) {

      error.textContent =
      "That username is already taken.";

      return;
    }


    const passwordHash =
    await hashPassword(password);


    await set(
      userRef,
      {
        username: username,
        passwordHash: passwordHash,
        displayName: username,
        bio: "",
        online: false
      }
    );


    success.textContent =
    "Account created! You can now log in.";

    document
    .getElementById("createUsername")
    .value = "";

    document
    .getElementById("createPassword")
    .value = "";

    document
    .getElementById("confirmPassword")
    .value = "";


  } catch (e) {

    console.error(e);

    error.textContent =
    "Could not create account.";

  }

}


/* LOGIN */

async function login() {

  const username =
  document
  .getElementById("loginUsername")
  .value
  .trim();

  const password =
  document
  .getElementById("loginPassword")
  .value;

  const error =
  document
  .getElementById("loginError");

  error.textContent = "";


  if (!username || !password) {

    error.textContent =
    "Enter your username and password.";

    return;
  }


  try {

    const userRef =
    ref(
      db,
      "users/" + key(username)
    );

    const snapshot =
    await get(userRef);


    if (!snapshot.exists()) {

      error.textContent =
      "Username or password is incorrect.";

      return;
    }


    const account =
    snapshot.val();

    const passwordHash =
    await hashPassword(password);


    if (
      passwordHash !==
      account.passwordHash
    ) {

      error.textContent =
      "Username or password is incorrect.";

      return;
    }


    currentUser =
    account.username;


    document
    .getElementById("loginPassword")
    .value = "";


    await set(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/online"
      ),
      true
    );


    const onlineRef =
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/online"
    );


    onDisconnect(onlineRef)
    .set(false);


    showHome();


  } catch (e) {

    console.error(e);

    error.textContent =
    "Could not log in. Please try again.";

  }

}


/* HOME */

function showHome() {

  hideScreens();

  document
  .getElementById("homeScreen")
  .classList.remove("hidden");

  document
  .getElementById("homeUsername")
  .textContent = currentUser;

  showFriendsTab();

  loadProfile();
  loadFriends();
  loadRequests();
  loadConversations();

}


/* TABS */

function showFriendsTab() {

  document
  .getElementById("friendsContent")
  .classList.remove("hidden");

  document
  .getElementById("roomsContent")
  .classList.add("hidden");

  document
  .getElementById("profileContent")
  .classList.add("hidden");

  document
  .getElementById("friendsTab")
  .classList.add("active");

  document
  .getElementById("roomsTab")
  .classList.remove("active");

  document
  .getElementById("profileTab")
  .classList.remove("active");

}


function showRoomsTab() {

  document
  .getElementById("friendsContent")
  .classList.add("hidden");

  document
  .getElementById("roomsContent")
  .classList.remove("hidden");

  document
  .getElementById("profileContent")
  .classList.add("hidden");

  document
  .getElementById("friendsTab")
  .classList.remove("active");

  document
  .getElementById("roomsTab")
  .classList.add("active");

  document
  .getElementById("profileTab")
  .classList.remove("active");

}


function showProfileTab() {

  document
  .getElementById("friendsContent")
  .classList.add("hidden");

  document
  .getElementById("roomsContent")
  .classList.add("hidden");

  document
  .getElementById("profileContent")
  .classList.remove("hidden");

  document
  .getElementById("friendsTab")
  .classList.remove("active");

  document
  .getElementById("roomsTab")
  .classList.remove("active");

  document
  .getElementById("profileTab")
  .classList.add("active");

  loadProfile();

}


/* PROFILE */

async function loadProfile() {

  if (!currentUser) return;


  const snapshot =
  await get(
    ref(
      db,
      "users/" +
      key(currentUser)
    )
  );


  if (!snapshot.exists()) return;


  const user =
  snapshot.val();


  const displayName =
  user.displayName ||
  user.username;


  document
  .getElementById("profileDisplayName")
  .textContent =
  displayName;


  document
  .getElementById("profileAvatar")
  .textContent =
  displayName
  .charAt(0)
  .toUpperCase();


  document
  .getElementById("profileBio")
  .textContent =
  user.bio || "No bio yet.";


  document
  .getElementById("displayNameInput")
  .value =
  user.displayName ||
  user.username;


  document
  .getElementById("bioInput")
  .value =
  user.bio || "";

}


async function saveProfile() {

  const displayName =
  document
  .getElementById("displayNameInput")
  .value
  .trim();

  const bio =
  document
  .getElementById("bioInput")
  .value
  .trim();

  const error =
  document
  .getElementById("profileError");

  const success =
  document
  .getElementById("profileSuccess");


  error.textContent = "";
  success.textContent = "";


  if (!displayName) {

    error.textContent =
    "Display name can't be empty.";

    return;
  }


  try {

    await set(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/displayName"
      ),
      displayName
    );


    await set(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/bio"
      ),
      bio
    );


    success.textContent =
    "Profile saved!";

    loadProfile();


  } catch (e) {

    console.error(e);

    error.textContent =
    "Couldn't save profile.";

  }

}


/* FRIEND REQUEST */

async function addFriend() {

  const username =
  document
  .getElementById("friendSearch")
  .value
  .trim();

  const error =
  document
  .getElementById("friendError");

  const success =
  document
  .getElementById("friendSuccess");


  error.textContent = "";
  success.textContent = "";


  if (!username) {

    error.textContent =
    "Enter a username.";

    return;
  }


  if (
    key(username) ===
    key(currentUser)
  ) {

    error.textContent =
    "You can't add yourself.";

    return;
  }


  try {

    const target =
    await get(
      ref(
        db,
        "users/" +
        key(username)
      )
    );


    if (!target.exists()) {

      error.textContent =
      "That user doesn't exist.";

      return;
    }


    const targetUser =
    target.val().username;


    const alreadyFriend =
    await get(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/friends/" +
        key(targetUser)
      )
    );


    if (alreadyFriend.exists()) {

      error.textContent =
      "You're already friends.";

      return;
    }


    await set(
      ref(
        db,
        "users/" +
        key(targetUser) +
        "/friendRequests/" +
        key(currentUser)
      ),
      {
        username: currentUser,
        timestamp: Date.now()
      }
    );


    document
    .getElementById("friendSearch")
    .value = "";


    success.textContent =
    "Friend request sent!";


  } catch (e) {

    console.error(e);

    error.textContent =
    "Couldn't send friend request.";

  }

}


/* REQUESTS */

async function loadRequests() {

  const list =
  document
  .getElementById("requestsList");

  list.innerHTML = "";


  const snapshot =
  await get(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/friendRequests"
    )
  );


  if (!snapshot.exists()) {

    list.innerHTML =
    '<div class="empty">No friend requests.</div>';

    return;
  }


  snapshot.forEach(child => {

    const request =
    child.val();


    const item =
    document.createElement("div");

    item.className =
    "list-item";


    const avatar =
    document.createElement("div");

    avatar.className =
    "avatar";

    avatar.textContent =
    request.username
    .charAt(0)
    .toUpperCase();


    const info =
    document.createElement("div");

    info.className =
    "item-info";

    info.innerHTML =
    `<div class="item-name">
      ${escapeHTML(request.username)}
    </div>
    <div class="item-subtitle">
      Friend request
    </div>`;


    const accept =
    document.createElement("button");

    accept.className =
    "item-button";

    accept.textContent =
    "Accept";

    accept.onclick =
    () => acceptFriend(request.username);


    const decline =
    document.createElement("button");

    decline.className =
    "item-button danger";

    decline.textContent =
    "Decline";

    decline.onclick =
    () => declineFriend(request.username);


    item.appendChild(avatar);
    item.appendChild(info);
    item.appendChild(accept);
    item.appendChild(decline);

    list.appendChild(item);

  });

}


/* ACCEPT FRIEND */

async function acceptFriend(username) {

  await set(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/friends/" +
      key(username)
    ),
    {
      username: username,
      timestamp: Date.now()
    }
  );


  await set(
    ref(
      db,
      "users/" +
      key(username) +
      "/friends/" +
      key(currentUser)
    ),
    {
      username: currentUser,
      timestamp: Date.now()
    }
  );


  await remove(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/friendRequests/" +
      key(username)
    )
  );


  loadRequests();
  loadFriends();

}


/* DECLINE */

async function declineFriend(username) {

  await remove(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/friendRequests/" +
      key(username)
    )
  );

  loadRequests();

}


/* REMOVE FRIEND */

async function removeFriend(username) {

  const confirmed =
  confirm(
    "Remove " +
    username +
    " from your friends?"
  );

  if (!confirmed) return;


  await remove(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/friends/" +
      key(username)
    )
  );


  await remove(
    ref(
      db,
      "users/" +
      key(username) +
      "/friends/" +
      key(currentUser)
    )
  );


  loadFriends();

}


/* LOAD FRIENDS */

async function loadFriends() {

  const list =
  document
  .getElementById("friendsList");

  list.innerHTML = "";


  const snapshot =
  await get(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/friends"
    )
  );


  if (!snapshot.exists()) {

    list.innerHTML =
    '<div class="empty">You don\'t have any friends yet.</div>';

    return;
  }


  const friends = [];


  snapshot.forEach(child => {

    friends.push(
      child.val().username
    );

  });


  for (const friend of friends) {

    const userSnapshot =
    await get(
      ref(
        db,
        "users/" +
        key(friend)
      )
    );


    const user =
    userSnapshot.exists()
      ? userSnapshot.val()
      : {};


    const displayName =
    user.displayName ||
    friend;

    const online =
    user.online === true;


    const item =
    document.createElement("div");

    item.className =
    "list-item";


    const avatar =
    document.createElement("div");

    avatar.className =
    "avatar" +
    (online ? " online" : "");

    avatar.textContent =
    displayName
    .charAt(0)
    .toUpperCase();


    const info =
    document.createElement("div");

    info.className =
    "item-info";

    info.innerHTML =
    `<div class="item-name">
      ${escapeHTML(displayName)}
    </div>
    <div class="item-subtitle ${
      online ? "online-text" : ""
    }">
      ${online ? "● Online" : "Offline"}
    </div>`;


    const messageButton =
    document.createElement("button");

    messageButton.className =
    "item-button";

    messageButton.textContent =
    "Message";

    messageButton.onclick =
    () => openDM(friend);


    const removeButton =
    document.createElement("button");

    removeButton.className =
    "item-button danger";

    removeButton.textContent =
    "Remove";

    removeButton.onclick =
    () => removeFriend(friend);


    item.appendChild(avatar);
    item.appendChild(info);
    item.appendChild(messageButton);
    item.appendChild(removeButton);

    list.appendChild(item);

  }

}


/* DM ID */

function dmID(a, b) {

  const first =
  key(a);

  const second =
  key(b);

  return first < second
    ? first + "_" + second
    : second + "_" + first;

}


/* OPEN DM */

async function openDM(username) {

  currentDMUser =
  username;


  hideScreens();

  document
  .getElementById("dmScreen")
  .classList.remove("hidden");


  document
  .getElementById("dmTitle")
  .textContent =
  username;


  document
  .getElementById("dmMessages")
  .innerHTML = "";


  document
  .getElementById("dmError")
  .textContent = "";


  /*
    IMPORTANT:
    Stop the previous listener first.
    This fixes the duplicate DM bug.
  */

  if (stopDMListener) {

    stopDMListener();

    stopDMListener = null;

  }


  const messagesRef =
  ref(
    db,
    "directMessages/" +
    dmID(
      currentUser,
      username
    ) +
    "/messages"
  );


  stopDMListener =
  onChildAdded(
    messagesRef,
    snapshot => {

      displayDM(
        snapshot.key,
        snapshot.val()
      );

    }
  );


  await set(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/unread/" +
      key(username)
    ),
    0
  );

}


/* DISPLAY DM */

function displayDM(id, message) {

  const box =
  document
  .getElementById("dmMessages");


  const wrapper =
  document.createElement("div");

  wrapper.className =
  "dm-message " +
  (
    message.username === currentUser
      ? "mine"
      : ""
  );


  const bubble =
  document.createElement("div");

  bubble.className =
  "bubble";


  const name =
  document.createElement("div");

  name.className =
  "bubble-name";

  name.textContent =
  message.username;


  const text =
  document.createElement("div");

  text.textContent =
  message.text;


  const time =
  document.createElement("div");

  time.className =
  "bubble-time";


  if (message.timestamp) {

    time.textContent =
    new Date(
      message.timestamp
    ).toLocaleTimeString(
      [],
      {
        hour: "numeric",
        minute: "2-digit"
      }
    );

  }


  bubble.appendChild(name);
  bubble.appendChild(text);
  bubble.appendChild(time);


  if (
    message.username ===
    currentUser
  ) {

    const deleteButton =
    document.createElement("button");

    deleteButton.className =
    "delete-message";

    deleteButton.textContent =
    "Delete";

    deleteButton.onclick =
    async () => {

      await remove(
        ref(
          db,
          "directMessages/" +
          dmID(
            currentUser,
            currentDMUser
          ) +
          "/messages/" +
          id
        )
      );

      wrapper.remove();

    };


    bubble.appendChild(
      deleteButton
    );

  }


  wrapper.appendChild(bubble);

  box.appendChild(wrapper);

  box.scrollTop =
  box.scrollHeight;

}


/* SEND DM */

async function sendDM() {

  const input =
  document
  .getElementById("dmInput");

  const text =
  input.value.trim();


  if (
    !text ||
    !currentDMUser
  ) return;


  try {

    const conversationID =
    dmID(
      currentUser,
      currentDMUser
    );


    const messagesRef =
    ref(
      db,
      "directMessages/" +
      conversationID +
      "/messages"
    );


    await push(
      messagesRef,
      {
        username: currentUser,
        text: text,
        timestamp: Date.now()
      }
    );


    await set(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/conversations/" +
        key(currentDMUser)
      ),
      {
        username: currentDMUser,
        timestamp: Date.now()
      }
    );


    await set(
      ref(
        db,
        "users/" +
        key(currentDMUser) +
        "/conversations/" +
        key(currentUser)
      ),
      {
        username: currentUser,
        timestamp: Date.now()
      }
    );


    /*
      Increase unread count
      for the person receiving it.
    */

    const unreadRef =
    ref(
      db,
      "users/" +
      key(currentDMUser) +
      "/unread/" +
      key(currentUser)
    );


    const unreadSnapshot =
    await get(unreadRef);


    const unread =
    unreadSnapshot.exists()
      ? unreadSnapshot.val()
      : 0;


    await set(
      unreadRef,
      Number(unread) + 1
    );


    input.value = "";
    input.focus();

    loadConversations();


  } catch (e) {

    console.error(e);

    document
    .getElementById("dmError")
    .textContent =
    "Message could not be sent.";

  }

}


/* CLOSE DM */

function closeDM() {

  if (stopDMListener) {

    stopDMListener();

    stopDMListener = null;

  }


  currentDMUser = null;

  document
  .getElementById("dmInput")
  .value = "";

  showHome();

}


/* LOAD CONVERSATIONS */

async function loadConversations() {

  const list =
  document
  .getElementById("dmList");

  list.innerHTML = "";


  const snapshot =
  await get(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/conversations"
    )
  );


  if (!snapshot.exists()) {

    list.innerHTML =
    '<div class="empty">No direct messages yet.</div>';

    return;
  }


  const unreadSnapshot =
  await get(
    ref(
      db,
      "users/" +
      key(currentUser) +
      "/unread"
    )
  );


  const unreadData =
  unreadSnapshot.exists()
    ? unreadSnapshot.val()
    : {};


  const conversations = [];


  snapshot.forEach(child => {

    conversations.push(
      child.val()
    );

  });


  conversations.sort(
    (a, b) =>
    (b.timestamp || 0) -
    (a.timestamp || 0)
  );


  conversations.forEach(
    conversation => {

      const username =
      conversation.username;

      const unread =
      Number(
        unreadData[key(username)] || 0
      );


      const item =
      document.createElement("div");

      item.className =
      "list-item";


      const avatar =
      document.createElement("div");

      avatar.className =
      "avatar";

      avatar.textContent =
      username
      .charAt(0)
      .toUpperCase();


      const info =
      document.createElement("div");

      info.className =
      "item-info";

      info.innerHTML =
      `<div class="item-name">
        ${escapeHTML(username)}
      </div>
      <div class="item-subtitle">
        Direct message
      </div>`;


      const openButton =
      document.createElement("button");

      openButton.className =
      "item-button";

      openButton.textContent =
      "Open";

      openButton.onclick =
      () => openDM(username);


      item.appendChild(avatar);
      item.appendChild(info);


      if (unread > 0) {

        const badge =
        document.createElement("div");

        badge.className =
        "badge";

        badge.textContent =
        unread > 99
          ? "99+"
          : unread;

        item.appendChild(badge);

      }


      item.appendChild(openButton);

      list.appendChild(item);

    }
  );

}


/* JOIN ROOM */

async function joinRoom() {

  const code =
  document
  .getElementById("roomCode")
  .value
  .trim();

  const error =
  document
  .getElementById("roomError");

  error.textContent = "";


  if (!/^\d{4}$/.test(code)) {

    error.textContent =
    "Room code must be exactly 4 digits.";

    return;
  }


  currentRoom =
  code;


  hideScreens();

  document
  .getElementById("chatScreen")
  .classList.remove("hidden");


  document
  .getElementById("displayRoomCode")
  .textContent =
  code;


  document
  .getElementById("chatUsername")
  .textContent =
  currentUser;


  document
  .getElementById("messages")
  .innerHTML = "";


  if (stopRoomListener) {

    stopRoomListener();

    stopRoomListener = null;

  }


  const messagesRef =
  ref(
    db,
    "rooms/" +
    code +
    "/messages"
  );


  stopRoomListener =
  onChildAdded(
    messagesRef,
    snapshot => {

      displayRoomMessage(
        snapshot.val()
      );

    }
  );


  await push(
    messagesRef,
    {
      username: "MyChat",
      text:
      currentUser +
      " joined the room.",
      system: true,
      timestamp: Date.now()
    }
  );

}


/* ROOM MESSAGE */

function displayRoomMessage(message) {

  const box =
  document
  .getElementById("messages");


  const div =
  document.createElement("div");

  div.className =
  "message";


  const username =
  document.createElement("div");

  username.className =
  "username";

  username.textContent =
  message.username;


  const text =
  document.createElement("div");

  text.textContent =
  message.text;


  div.appendChild(username);
  div.appendChild(text);

  box.appendChild(div);

  box.scrollTop =
  box.scrollHeight;

}


/* SEND ROOM MESSAGE */

async function sendMessage() {

  const input =
  document
  .getElementById("messageInput");

  const text =
  input.value.trim();


  if (
    !text ||
    !currentRoom
  ) return;


  try {

    await push(
      ref(
        db,
        "rooms/" +
        currentRoom +
        "/messages"
      ),
      {
        username: currentUser,
        text: text,
        timestamp: Date.now()
      }
    );


    input.value = "";
    input.focus();


  } catch (e) {

    console.error(e);

    document
    .getElementById("chatError")
    .textContent =
    "Message could not be sent.";

  }

}


/* LEAVE ROOM */

async function leaveRoom() {

  if (currentRoom) {

    await push(
      ref(
        db,
        "rooms/" +
        currentRoom +
        "/messages"
      ),
      {
        username: "MyChat",
        text:
        currentUser +
        " left the room.",
        system: true,
        timestamp: Date.now()
      }
    );

  }


  if (stopRoomListener) {

    stopRoomListener();

    stopRoomListener = null;

  }


  currentRoom = null;

  document
  .getElementById("messageInput")
  .value = "";

  showHome();

}


/* LOG OUT */

async function logout() {

  if (currentUser) {

    await set(
      ref(
        db,
        "users/" +
        key(currentUser) +
        "/online"
      ),
      false
    );

  }


  if (stopDMListener) {

    stopDMListener();

    stopDMListener = null;

  }


  if (stopRoomListener) {

    stopRoomListener();

    stopRoomListener = null;

  }


  currentUser = null;
  currentRoom = null;
  currentDMUser = null;

  showLogin();

}


/* HTML ESCAPE */

function escapeHTML(text) {

  const div =
  document.createElement("div");

  div.textContent =
  text;

  return div.innerHTML;

}

/* ENTER KEY */

document.addEventListener(
  "keydown",
  event => {

    if (
      event.key !== "Enter" ||
      event.shiftKey
    ) return;


    if (
      !document
      .getElementById("loginScreen")
      .classList
      .contains("hidden")
    ) {

      login();

    }

    else if (
      !document
      .getElementById("createScreen")
      .classList
      .contains("hidden")
    ) {

      createAccount();

    }

    else if (
      !document
      .getElementById("dmScreen")
      .classList
      .contains("hidden")
    ) {

      sendDM();

    }

    else if (
      !document
      .getElementById("chatScreen")
      .classList
      .contains("hidden")
    ) {

      sendMessage();

    }

  }
);
