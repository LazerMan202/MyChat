<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChat 1.7</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#111827;
  color:#f9fafb;
}
button,input,textarea{
  font:inherit;
}
button{
  border:0;
  border-radius:8px;
  padding:9px 13px;
  cursor:pointer;
  background:#2563eb;
  color:white;
}
button:hover{opacity:.9}
button.secondary{background:#374151}
button.danger{background:#dc2626}
button.small{padding:5px 8px;font-size:12px}

.hidden{display:none!important}

.screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  background:#1f2937;
  width:100%;
  max-width:430px;
  padding:25px;
  border-radius:15px;
  box-shadow:0 10px 35px #0006;
}

h1,h2,h3{margin-top:0}

input,textarea{
  width:100%;
  padding:11px;
  margin:6px 0;
  border:1px solid #374151;
  border-radius:8px;
  background:#111827;
  color:white;
  outline:none;
}
textarea{resize:vertical;min-height:70px}

.authButtons{
  display:flex;
  gap:10px;
  margin-top:12px;
}
.authButtons button{flex:1}

.error{
  color:#f87171;
  min-height:20px;
  margin-top:8px;
}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

.topbar{
  height:60px;
  background:#1f2937;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #374151;
}

.logo{
  font-size:21px;
  font-weight:bold;
}

.userTop{
  display:flex;
  align-items:center;
  gap:9px;
}

.main{
  flex:1;
  display:flex;
  min-height:calc(100vh - 60px);
}

.sidebar{
  width:290px;
  background:#18212f;
  border-right:1px solid #374151;
  padding:12px;
  overflow-y:auto;
}

.tabs{
  display:flex;
  gap:5px;
  margin-bottom:12px;
}
.tabs button{
  flex:1;
  background:#263244;
}
.tabs button.active{
  background:#2563eb;
}

.tabUnread{
  background:#ef4444;
  border-radius:999px;
  padding:1px 6px;
  font-size:11px;
  margin-left:3px;
}

.listItem{
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px;
  border-radius:9px;
  cursor:pointer;
  margin-bottom:3px;
}
.listItem:hover,.listItem.selected{
  background:#263244;
}

.listText{
  min-width:0;
  flex:1;
}
.listName{
  font-weight:bold;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
.preview{
  color:#9ca3af;
  font-size:12px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.unread{
  background:#2563eb;
  border-radius:999px;
  padding:3px 7px;
  font-size:11px;
}

.onlineDot{
  width:9px;
  height:9px;
  background:#22c55e;
  border-radius:50%;
  display:inline-block;
}
.offlineDot{
  width:9px;
  height:9px;
  background:#6b7280;
  border-radius:50%;
  display:inline-block;
}

.avatar{
  width:38px;
  height:38px;
  min-width:38px;
  border-radius:50%;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  overflow:hidden;
}
.avatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}

.chatHeader{
  min-height:65px;
  background:#1f2937;
  border-bottom:1px solid #374151;
  padding:9px 14px;
  display:flex;
  align-items:center;
  gap:10px;
}

.chatHeaderInfo{
  flex:1;
  min-width:0;
}

.chatTitle{
  font-weight:bold;
  font-size:17px;
}

.chatSub{
  color:#9ca3af;
  font-size:12px;
}

.headerButtons{
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  justify-content:flex-end;
}

.searchBox{
  display:none;
  background:#111827;
  padding:8px;
  border-bottom:1px solid #374151;
}
.searchBox.show{display:block}
.searchControls{
  display:flex;
  gap:5px;
}
.searchControls input{margin:0}
.searchCount{
  font-size:12px;
  color:#9ca3af;
  padding-top:4px;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.message{
  margin-bottom:13px;
  display:flex;
  gap:8px;
  align-items:flex-start;
}
.message.mine{
  flex-direction:row-reverse;
}

.messageContent{
  max-width:min(75%,650px);
}

.sender{
  font-size:12px;
  color:#9ca3af;
  margin-bottom:3px;
}

.bubble{
  background:#263244;
  border-radius:12px;
  padding:9px 11px;
  word-wrap:break-word;
  white-space:pre-wrap;
}

.mine .bubble{
  background:#2563eb;
}

.messageTime{
  font-size:10px;
  color:#9ca3af;
  margin-top:3px;
}

.mine .messageTime{text-align:right}

.edited{
  font-size:10px;
  color:#9ca3af;
}

.replyPreview{
  border-left:3px solid #60a5fa;
  padding:5px 8px;
  margin-bottom:5px;
  background:#11182799;
  border-radius:5px;
  font-size:11px;
  cursor:pointer;
}

.actions{
  display:flex;
  gap:3px;
  flex-wrap:wrap;
  margin-top:4px;
}
.actions button{
  padding:3px 6px;
  font-size:11px;
  background:#374151;
}

.reactions{
  display:flex;
  gap:3px;
  margin-top:4px;
  flex-wrap:wrap;
}
.reaction{
  background:#111827;
  border-radius:12px;
  padding:2px 6px;
  font-size:12px;
}

.highlight{
  outline:2px solid #facc15;
  border-radius:12px;
}

.searchHighlight{
  outline:2px solid #facc15;
}

.composer{
  border-top:1px solid #374151;
  background:#1f2937;
  padding:9px;
}

.replyBar{
  background:#111827;
  padding:7px 10px;
  border-radius:7px;
  margin-bottom:6px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-size:12px;
}

.composeRow{
  display:flex;
  gap:7px;
}
.composeRow input{
  margin:0;
}
.composeRow button{
  min-width:70px;
}

.empty{
  color:#9ca3af;
  text-align:center;
  padding:30px 10px;
}

.panel{
  padding:15px;
}

.profilePreview{
  display:flex;
  justify-content:center;
  margin-bottom:15px;
}
.bigAvatar{
  width:100px;
  height:100px;
  border-radius:50%;
  background:#2563eb;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:40px;
  font-weight:bold;
  overflow:hidden;
}
.bigAvatar img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.profileButtons{
  display:flex;
  gap:6px;
  justify-content:center;
  margin-bottom:15px;
}

.modal{
  position:fixed;
  inset:0;
  background:#000b;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:10;
}
.modalCard{
  background:#1f2937;
  border-radius:14px;
  width:100%;
  max-width:500px;
  max-height:90vh;
  overflow-y:auto;
  padding:20px;
}
.modalActions{
  display:flex;
  gap:7px;
  margin-top:12px;
  justify-content:flex-end;
}

.friendCheck{
  display:flex;
  align-items:center;
  gap:8px;
  padding:7px;
}
.friendCheck input{
  width:auto;
  margin:0;
}

.memberRow{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px;
  background:#263244;
  border-radius:8px;
  margin-bottom:5px;
}

.memberRow .memberName{
  flex:1;
}

.creator{
  color:#facc15;
  font-size:12px;
}

.pinItem{
  padding:8px;
  border-radius:8px;
  background:#263244;
  margin-bottom:6px;
  cursor:pointer;
}
.pinItem:hover{background:#334155}

@media(max-width:750px){
  .sidebar{
    width:220px;
  }
  .messageContent{
    max-width:82%;
  }
}

@media(max-width:600px){
  .sidebar{
    width:100%;
    max-width:100%;
  }
  .main{
    flex-direction:column;
  }
  .sidebar{
    max-height:260px;
    border-right:0;
    border-bottom:1px solid #374151;
  }
  .chat{
    min-height:500px;
  }
}
</style>
</head>

<body>

<div id="authScreen" class="screen">
  <div class="card">
    <h1>💬 MyChat</h1>
    <p id="authTitle">Log in to MyChat</p>

    <div id="loginForm">
      <input id="loginUsername" placeholder="Username" autocomplete="username">
      <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password">

      <div class="authButtons">
        <button id="loginBtn">Log In</button>
        <button id="showCreateBtn" class="secondary">Create Account</button>
      </div>
    </div>

    <div id="createForm" class="hidden">
      <input id="createUsername" placeholder="Username">
      <input id="createPassword" type="password" placeholder="Password">

    <div id="authError" class="error"></div>
  </div>
</div>


<div id="app" class="hidden">

  <div class="topbar">
    <div class="logo">💬 MyChat <span style="color:#9ca3af;font-size:12px">1.7</span></div>

    <div class="userTop">
      <span id="topAvatar" class="avatar"></span>
      <span id="topUsername"></span>
      <button id="logoutBtn" class="secondary small">Log Out</button>
    </div>
  </div>

  <div class="main">

    <aside class="sidebar">

      <div class="tabs">
        <button id="friendsTab" class="active">
          👥 Friends
        </button>
        <button id="roomsTab">
          🏠 Rooms
        </button>
        <button id="profileTab">
          👤 Profile
        </button>
      </div>

      <div id="friendsPanel">

        <button id="newGroupBtn" style="width:100%;margin-bottom:8px">
          ➕ Create Group
        </button>

        <input id="friendSearch" placeholder="Search username">

        <button id="sendRequestBtn" style="width:100%;margin-bottom:10px">
          Add Friend
        </button>

        <div id="friendRequests"></div>

        <h3 style="font-size:14px;color:#9ca3af">Friends</h3>
        <div id="friendsList"></div>

        <h3 style="font-size:14px;color:#9ca3af;margin-top:15px">Chats</h3>
        <div id="chatList"></div>

      </div>


      <div id="roomsPanel" class="hidden">

        <input id="roomCode" maxlength="4" placeholder="4-digit room code">

        <button id="joinRoomBtn" style="width:100%">

        </button>

        <div id="roomStatus" style="margin-top:10px;color:#9ca3af"></div>

      </div>


      <div id="profilePanel" class="hidden panel">

        <div class="profilePreview">
          <div id="profileAvatar" class="bigAvatar"></div>
        </div>

        <div class="profileButtons">

          <button id="removePictureBtn" class="secondary">Remove</button>

        <label>Display Name</label>
        <input id="displayNameInput">

        <button id="saveProfileBtn" style="width:100%">

        <div id="profileStatus" style="color:#9ca3af;font-size:12px;margin-top:8px"></div>

    </aside>


    <section class="chat">

      <div id="chatHeader" class="chatHeader">
        <div class="chatHeaderInfo">
          <div class="chatTitle">Welcome to MyChat</div>
          <div class="chatSub">Choose a friend, group, or room.</div>
        </div>
      </div>

      <div id="searchBox" class="searchBox">
        <div class="searchControls">
          <input id="messageSearch" placeholder="Search messages...">
          <button id="prevSearchBtn" class="secondary small">↑</button>
          <button id="nextSearchBtn" class="secondary small">↓</button>
          <button id="closeSearchBtn" class="secondary small">✕</button>
        </div>
        <div id="searchCount" class="searchCount"></div>
      </div>

      <div id="messages" class="messages">
        <div class="empty">
          👋 Welcome to MyChat
        </div>

      <div id="composer" class="composer hidden">

        <div id="replyBar" class="replyBar hidden">
          <span id="replyText"></span>

  </div>
</div>


<!-- GROUP CREATE MODAL -->
<div id="groupModal" class="modal hidden">
  <div class="modalCard">
    <h2>👥 Create Group</h2>

    <input id="groupNameInput" placeholder="Group name">

    <h3 style="font-size:14px">Add friends</h3>
    <div id="groupFriendList"></div>

    <div class="modalActions">
      <button id="cancelGroupBtn" class="secondary">Cancel</button>
      <button id="createGroupBtn">Create Group</button>
    </div>

    <div id="groupError" class="error"></div>
  </div>
</div>


<!-- GROUP MANAGEMENT MODAL -->
<div id="manageGroupModal" class="modal hidden">
  <div class="modalCard">

    <h2>👥 Group Management</h2>

    <input id="renameGroupInput" placeholder="Group name">

    <button id="renameGroupBtn" style="width:100%;margin-top:5px">
      Rename Group
    </button>

    <h3 style="margin-top:18px;font-size:15px">Members</h3>
    <div id="groupMembersList"></div>

    <h3 style="margin-top:18px;font-size:15px">Add Friends</h3>
    <div id="groupAddFriendsList"></div>

    <div class="modalActions">
      <button id="closeManageGroupBtn" class="secondary">Close</button>
    </div>

    <div id="manageGroupError" class="error"></div>

  </div>
</div>


<!-- PINNED MODAL -->
<div id="pinsModal" class="modal hidden">
  <div class="modalCard">

    <h2>📌 Pinned Messages</h2>

    <div id="pinsList"></div>

    <div class="modalActions">
      <button id="closePinsBtn" class="secondary">Close</button>
    </div>

  </div>
</div>


<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  push,
  remove,
  update,
  onChildAdded,
  onChildChanged,
  onChildRemoved,
  onValue,
  onDisconnect
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


const firebaseConfig = {
  apiKey: "AIzaSyDFun3M-6mzjBL8DFcfmJzDv7blNODQd0",
  authDomain: "mychat-8dac2.firebaseapp.com",
  databaseURL: "https://mychat-8dac2-default-rtdb.firebaseio.com",
  projectId: "mychat-8dac2",
  storageBucket: "mychat-8dac2.firebasestorage.app",
  messagingSenderId: "906137277444",
  appId: "1:906137277444:web:b9d52ef4ec1f76afe09151"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);


/* ---------------- STATE ---------------- */

let currentUser = null;
let currentRoom = null;
let currentChatType = null;
let currentChatId = null;
let currentDMUser = null;
let currentGroup = null;

let stopChatListener = null;
let stopRoomListener = null;

let replyTo = null;

let currentMessages = {};
let searchMatches = [];
let searchIndex = 0;

let userDataCache = {};


/* ---------------- HELPERS ---------------- */

function key(username){
  return username.toLowerCase();
}

function escapeHTML(text){
  const div = document.createElement("div");
  div.textContent = text ?? "";
  return div.innerHTML;
}

function formatTime(timestamp){
  if(!timestamp) return "";
  return new Date(timestamp).toLocaleString([],{
    month:"short",
    day:"numeric",
    hour:"numeric",
    minute:"2-digit"
  });
}

function conversationId(a,b){
  return [key(a),key(b)].sort().join("_");
}

function avatarHTML(user,size="avatar"){
  const d = userDataCache[key(user)] || {};

  if(d.profilePicture){
    return `
      <div class="${size}">
        <img src="${d.profilePicture}">
      </div>
    `;
  }

  return `
    <div class="${size}">
      ${escapeHTML((d.displayName || user).charAt(0).toUpperCase())}
    </div>
  `;
}

async function getUserData(username){
  const k = key(username);

  if(userDataCache[k]){
    return userDataCache[k];
  }

  const snap = await get(ref(db,`users/${k}`));

  const data = snap.exists() ? snap.val() : {};

  userDataCache[k] = data;

  return data;
}

async function refreshUserCache(username){
  const snap = await get(ref(db,`users/${key(username)}`));

  userDataCache[key(username)] =
    snap.exists() ? snap.val() : {};
}


/* ---------------- AUTH ---------------- */

async function hashPassword(password){

  const data = new TextEncoder().encode(password);

  const hash = await crypto.subtle.digest("SHA-256",data);

  return [...new Uint8Array(hash)]
    .map(b=>b.toString(16).padStart(2,"0"))
    .join("");
}


function showLogin(){

  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("createForm").classList.add("hidden");

  document.getElementById("authTitle").textContent =
    "Log in to MyChat";

  document.getElementById("authError").textContent="";
}


function showCreate(){

  document.getElementById("loginForm").classList.add("hidden");
  document.getElementById("createForm").classList.remove("hidden");

  document.getElementById("authTitle").textContent =
    "Create your MyChat account";

  document.getElementById("authError").textContent="";
}


async function createAccount(){

  const username =
    document.getElementById("createUsername").value.trim();

  const password =
    document.getElementById("createPassword").value;

  const error =
    document.getElementById("authError");

  if(!/^[A-Za-z0-9_]{3,20}$/.test(username)){
    error.textContent =
      "Username must be 3–20 letters, numbers, or underscores.";
    return;
  }

  if(password.length < 4){
    error.textContent =
      "Password must be at least 4 characters.";
    return;
  }

  const k = key(username);

  const existing =
    await get(ref(db,`users/${k}`));

  if(existing.exists()){
    error.textContent="That username already exists.";
    return;
  }

  const passwordHash =
    await hashPassword(password);

  await set(ref(db,`users/${k}`),{
    username,
    displayName:username,
    bio:"",
    passwordHash,
    online:false,
    createdAt:Date.now()
  });

  error.textContent="Account created! You can now log in.";

  document.getElementById("createPassword").value="";

  showLogin();

  document.getElementById("loginUsername").value=username;
}


async function login(){

  const username =
    document.getElementById("loginUsername").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const error =
    document.getElementById("authError");

  if(!username || !password){
    error.textContent="Enter your username and password.";
    return;
  }

  const snap =
    await get(ref(db,`users/${key(username)}`));

  if(!snap.exists()){
    error.textContent="Account not found.";
    return;
  }

  const data=snap.val();

  const hash=await hashPassword(password);

  if(hash !== data.passwordHash){
    error.textContent="Incorrect password.";
    return;
  }

  currentUser=data.username;

  await refreshUserCache(currentUser);

  await set(
    ref(db,`users/${key(currentUser)}/online`),
    true
  );

  onDisconnect(
    ref(db,`users/${key(currentUser)}/online`)
  ).set(false);

  showHome();
}


/* ---------------- APP ---------------- */

function showHome(){

  document.getElementById("authScreen")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  document.getElementById("topUsername")
    .textContent=currentUser;

  renderTopAvatar();

  loadFriends();
  loadChats();

  showFriends();

  updateUnreadBadge();
}


function renderTopAvatar(){

  const d =
    userDataCache[key(currentUser)] || {};

  const el=document.getElementById("topAvatar");

  if(d.profilePicture){
    el.innerHTML=`<img src="${d.profilePicture}">`;
  }else{
    el.textContent=
      (d.displayName || currentUser)
      .charAt(0)
      .toUpperCase();
  }
}


async function logout(){

  if(!currentUser)return;

  await set(
    ref(db,`users/${key(currentUser)}/online`),
    false
  );

  stopCurrentChatListener();

  if(stopRoomListener){
    stopRoomListener();
    stopRoomListener=null;
  }

  currentUser=null;

  document.getElementById("app")
    .classList.add("hidden");

  document.getElementById("authScreen")
    .classList.remove("hidden");

  document.getElementById("loginPassword").value="";
}


/* ---------------- TABS ---------------- */

function showFriends(){

  document.getElementById("friendsPanel")
    .classList.remove("hidden");

  document.getElementById("roomsPanel")
    .classList.add("hidden");

  document.getElementById("profilePanel")
    .classList.add("hidden");

  setActiveTab("friendsTab");

  loadFriends();
  loadChats();
}


function showRooms(){

  document.getElementById("friendsPanel")
    .classList.add("hidden");

  document.getElementById("roomsPanel")
    .classList.remove("hidden");

  document.getElementById("profilePanel")
    .classList.add("hidden");

  setActiveTab("roomsTab");
}


function showProfile(){

  document.getElementById("friendsPanel")
    .classList.add("hidden");

  document.getElementById("roomsPanel")
    .classList.add("hidden");

  document.getElementById("profilePanel")
    .classList.remove("hidden");

  setActiveTab("profileTab");

  loadProfile();
}


function setActiveTab(id){

  document.querySelectorAll(".tabs button")

function renderProfileAvatar(){

  const d=userDataCache[key(currentUser)] || {};

  const el=document.getElementById("profileAvatar");

    el.innerHTML=`<img src="${d.profilePicture}">`;
  }else{
    el.textContent=
      (d.displayName || currentUser)
      .charAt(0)
      .toUpperCase();
  }
}


async function compressImage(file){

  return new Promise((resolve,reject)=>{

    const reader=new FileReader();

    reader.onload=()=>{

      const img=new Image();

      img.onload=()=>{

        const max=256;

        let width=img.width;
        let height=img.height;

        if(width>max || height>max){

          if(width>height){
            height=Math.round(height*max/width);
            width=max;
          }else{
            width=Math.round(width*max/height);
            height=max;
          }
        }

        const canvas=document.createElement("canvas");

        canvas.width=width;
        canvas.height=height;

        canvas.getContext("2d")
          .drawImage(img,0,0,width,height);

        resolve(
          canvas.toDataURL("image/jpeg",0.75)
        );
      };

      img.onerror=reject;
      img.src=reader.result;
    };

    reader.onerror=reject;

    reader.readAsDataURL(file);
  });
}


async function saveProfile(){

  const displayName=
    document.getElementById("displayNameInput")
      .value.trim();

  const bio=
    document.getElementById("bioInput")
      .value.trim();

  if(!displayName){
    document.getElementById("profileStatus")
      .textContent="Display name cannot be empty.";
    return;
  }

  await update(
    ref(db,`users/${key(currentUser)}`),
    {
      displayName,
      bio
    }
  );

  await refreshUserCache(currentUser);

  renderProfileAvatar();
  renderTopAvatar();

  document.getElementById("profileStatus")
    .textContent="Profile saved!";
}


async function choosePicture(file){

  if(!file)return;

  try{

    const picture=await compressImage(file);

    await set(
      ref(db,`users/${key(currentUser)}/profilePicture`),
      picture
    );

    await refreshUserCache(currentUser);

    renderProfileAvatar();
    renderTopAvatar();

    document.getElementById("profileStatus")
      .textContent="Profile picture updated.";

  }catch(e){

    document.getElementById("profileStatus")
      .textContent="Could not load that image.";
  }
}


async function removePicture(){

  await remove(
    ref(db,`users/${key(currentUser)}/profilePicture`)
  );

  await refreshUserCache(currentUser);

  renderProfileAvatar();
  renderTopAvatar();
}


/* ---------------- FRIENDS ---------------- */

async function sendFriendRequest(){

  const username=
    document.getElementById("friendSearch")
      .value.trim();

  if(!username){
    alert("Enter a username.");
    return;
  }

  if(key(username)===key(currentUser)){
    alert("You can't add yourself.");
    return;
  }

  const snap=
    await get(ref(db,`users/${key(username)}`));

  if(!snap.exists()){
    alert("User not found.");
    return;
  }

  const already=
    await get(
      ref(db,
      `users/${key(currentUser)}/friends/${key(username)}`)
    );

  if(already.exists()){
    alert("You're already friends.");
    return;
  }

  await set(
    ref(db,
    `users/${key(username)}/friendRequests/${key(currentUser)}`),
    {
      username:currentUser,
      timestamp:Date.now()
    }
  );

  alert("Friend request sent!");
}


async function loadFriends(){

  const list=
    document.getElementById("friendsList");

  const requests=
    document.getElementById("friendRequests");

  list.innerHTML="";
  requests.innerHTML="";

  const snap=
    await get(
      ref(db,`users/${key(currentUser)}/friends`)
    );

  const friends=snap.exists()?snap.val():{};

  const friendKeys=Object.keys(friends);

  if(!friendKeys.length){
    list.innerHTML=
      `<div class="empty">No friends yet.</div>`;
  }

  for(const friendKey of friendKeys){

    const username=
      friends[friendKey].username || friendKey;

    await refreshUserCache(username);

    const d=userDataCache[key(username)] || {};

    const item=document.createElement("div");

    item.className="listItem";

    item.innerHTML=`
      ${avatarHTML(username)}
      <div class="listText">
        <div class="listName">
          ${escapeHTML(d.displayName || username)}
        </div>
        <div class="preview">
          ${d.online
            ? '<span class="onlineDot"></span> Online'
            : '<span class="offlineDot"></span> Offline'}
        </div>
      </div>
    `;

    item.onclick=()=>openDM(username);

    list.appendChild(item);
  }

  const reqSnap=
    await get(
      ref(db,
      `users/${key(currentUser)}/friendRequests`)
    );

  const reqs=reqSnap.exists()?reqSnap.val():{};

  for(const requesterKey of Object.keys(reqs)){

    const req=reqs[requesterKey];

    const row=document.createElement("div");

    row.className="listItem";

    row.innerHTML=`
      ${avatarHTML(req.username)}
      <div class="listText">
        <div class="listName">
          ${escapeHTML(req.username)}
        </div>
        <div class="preview">Friend request</div>
      </div>
      <button class="small" data-accept>✓</button>
      <button class="danger small" data-decline>✕</button>
    `;

    row.querySelector("[data-accept]")
      .onclick=()=>acceptFriend(req.username);

    row.querySelector("[data-decline]")
      .onclick=()=>declineFriend(req.username);

    requests.appendChild(row);
  }
}


async function acceptFriend(username){

  const me=key(currentUser);
  const them=key(username);

  await set(
    ref(db,`users/${me}/friends/${them}`),
    {
      username,
      timestamp:Date.now()
    }
  );

  await set(
    ref(db,`users/${them}/friends/${me}`),
    {
      username:currentUser,
      timestamp:Date.now()
    }
  );

  await remove(
    ref(db,`users/${me}/friendRequests/${them}`)
  );

  loadFriends();
}


async function declineFriend(username){

  await remove(
    ref(db,
    `users/${key(currentUser)}/friendRequests/${key(username)}`)
  );

  loadFriends();
}


async function removeFriend(username){

  if(!confirm(`Remove ${username} from your friends?`))
    return;

  await remove(
    ref(db,
    `users/${key(currentUser)}/friends/${key(username)}`)
  );

  await remove(
    ref(db,
    `users/${key(username)}/friends/${key(currentUser)}`)
  );

  loadFriends();
}


/* ---------------- CHAT LIST ---------------- */

async function loadChats(){

  const list=document.getElementById("chatList");

  list.innerHTML="";

  const userSnap=
    await get(
      ref(db,`users/${key(currentUser)}`)
    );

  const user=userSnap.exists()?userSnap.val():{};

  const conversations=user.conversations || {};
  const groups=user.groups || {};

  const entries=[];

  for(const k of Object.keys(conversations)){

    const c=conversations[k];

    entries.push({
      type:"dm",
      id:k,
      username:c.username || findOtherUser(k),
      timestamp:c.lastMessageTimestamp || 0,
      data:c
    });
  }

  for(const id of Object.keys(groups)){

    const gSnap=
      await get(ref(db,`groupChats/${id}`));

    if(gSnap.exists()){

      entries.push({
        type:"group",
        id,
        timestamp:gSnap.val().lastMessageTimestamp || 0,
        data:{
          ...groups[id],
          ...gSnap.val()
        }
      });
    }
  }

  entries.sort((a,b)=>b.timestamp-a.timestamp);

  if(!entries.length){
    list.innerHTML=
      `<div class="empty">Your chats will appear here.</div>`;
    return;
  }

  for(const entry of entries){

    const item=document.createElement("div");

    item.className="listItem";

    let title="";
    let preview="";

    if(entry.type==="dm"){

      const username=entry.username;

      await refreshUserCache(username);

      const d=userDataCache[key(username)] || {};

      title=d.displayName || username;

      preview=entry.data.lastMessage || "Direct message";

      item.innerHTML=`
        ${avatarHTML(username)}
        <div class="listText">
          <div class="listName">${escapeHTML(title)}</div>
          <div class="preview">${escapeHTML(preview)}</div>
        </div>
      `;

      const unread=
        user.unread?.[key(username)] || 0;

      if(unread){
        item.innerHTML+=
          `<span class="unread">${unread}</span>`;
      }

      item.onclick=()=>openDM(username);

    }else{

      title=entry.data.name || "Group";

      preview=entry.data.lastMessage
        ? `${entry.data.lastMessageUsername || ""}: ${entry.data.lastMessage}`
        : "Group chat";

      item.innerHTML=`
        <div class="avatar">👥</div>
        <div class="listText">
          <div class="listName">${escapeHTML(title)}</div>
          <div class="preview">${escapeHTML(preview)}</div>
        </div>
      `;

      const unread=
        user.unread?.[`group_${entry.id}`] || 0;

      if(unread){
        item.innerHTML+=
          `<span class="unread">${unread}</span>`;
      }

      item.onclick=()=>openGroup(entry.id);
    }

    list.appendChild(item);
  }

  updateUnreadBadge();
}


function findOtherUser(id){

  const parts=id.split("_");

  return parts.find(x=>x!==key(currentUser)) || parts[0];
}


async function updateConversationPreviewDM(
  username,
  text,
  timestamp
){

  const otherKey=key(username);

  await update(
    ref(db,
    `users/${key(currentUser)}/conversations/${conversationId(currentUser,username)}`),
    {
      username,
      lastMessage:text,
      lastMessageUsername:currentUser,
      lastMessageTimestamp:timestamp
    }
  );

  await update(
    ref(db,
    `users/${otherKey}/conversations/${conversationId(currentUser,username)}`),
    {
      username:currentUser,
      lastMessage:text,
      lastMessageUsername:currentUser,
      lastMessageTimestamp:timestamp
    }
  );
}


async function updateConversationPreviewGroup(
  groupId,
  text,
  username,
  timestamp
){

  const snap=
    await get(ref(db,`groupChats/${groupId}/members`));

  if(!snap.exists())return;

  const members=snap.val();

  await update(
    ref(db,`groupChats/${groupId}`),
    {
      lastMessage:text,
      lastMessageUsername:username,
      lastMessageTimestamp:timestamp
    }
  );

  for(const member of Object.keys(members)){

    await update(
      ref(db,`users/${member}/groups/${groupId}`),
      {
        lastMessage:text,
        lastMessageUsername:username,
        lastMessageTimestamp:timestamp
      }
    );
  }
}

    stopChatListener=null;

  currentMessages={};
  replyTo=null;

  document.getElementById("replyBar")

/* ---------------- DM ---------------- */

async function openDM(username){

  stopCurrentChatListener();

  currentChatType="dm";
  currentDMUser=username;
  currentGroup=null;

  const id=
    conversationId(currentUser,username);

  currentChatId=id;

  await set(
    ref(db,
    `users/${key(currentUser)}/unread/${key(username)}`),
    0
  );

  await refreshUserCache(username);

  const d=userDataCache[key(username)] || {};

  document.getElementById("chatHeader")
    .innerHTML=`
      ${avatarHTML(username)}
      <div class="chatHeaderInfo">
        <div class="chatTitle">
          ${escapeHTML(d.displayName || username)}
        </div>
        <div class="chatSub">
          ${d.online
            ? "🟢 Online"
            : "⚫ Offline"}
        </div>
      </div>

      <div class="headerButtons">
        <button id="searchBtn" class="secondary small">🔎</button>
        <button id="pinsBtn" class="secondary small">📌</button>
      </div>
    `;

  document.getElementById("searchBtn").onclick=
    openSearch;

  document.getElementById("pinsBtn").onclick=
    showPins;

  document.getElementById("composer")
    .classList.remove("hidden");

  document.getElementById("messages").innerHTML="";

  const messagesRef=
    ref(db,`directMessages/${id}/messages`);

  const added=
    onChildAdded(messagesRef,snap=>{
      currentMessages[snap.key]=snap.val();
      renderMessage(snap.key,snap.val());
      updateSearchResults();
    });

  const changed=
    onChildChanged(messagesRef,snap=>{
      currentMessages[snap.key]=snap.val();
      rerenderMessage(snap.key);
      updateSearchResults();
    });

  const removed=
    onChildRemoved(messagesRef,snap=>{
      delete currentMessages[snap.key];

      const el=
        document.querySelector(
          `[data-message-id="${snap.key}"]`
        );

      if(el)el.remove();

      updateSearchResults();
    });

  stopChatListener=()=>{
    added();
    changed();
    removed();
  };

  updateUnreadBadge();
  loadChats();
}


async function sendDM(){

  if(!currentDMUser)return;

  const input=
    document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text)return;

  const id=
    conversationId(currentUser,currentDMUser);

  const message={
    username:currentUser,
    text,
    timestamp:Date.now(),
    edited:false
  };

  if(replyTo){
    message.replyTo=replyTo;
  }

  const messageRef=
    push(
      ref(db,`directMessages/${id}/messages`)
    );

  await set(messageRef,message);

  await updateConversationPreviewDM(
    currentDMUser,
    text,
    message.timestamp
  );

  await set(
    ref(db,
    `users/${key(currentDMUser)}/unread/${key(currentUser)}`),
    ((await get(
      ref(db,
      `users/${key(currentDMUser)}/unread/${key(currentUser)}`)
    )).val() || 0)+1
  );

  input.value="";
  cancelReply();

  loadChats();
}


async function deleteMessage(id){

  if(currentChatType==="dm"){

    await remove(
      ref(db,
      `directMessages/${currentChatId}/messages/${id}`)
    );

  }else if(currentChatType==="group"){

    await remove(
      ref(db,
      `groupChats/${currentGroup}/messages/${id}`)
    );
  }
}


async function editMessage(id){

  const old=currentMessages[id];

  if(!old || old.username!==currentUser)return;

  const text=prompt(
    "Edit message:",
    old.text
  );

  if(text===null)return;

  const newText=text.trim();

  if(!newText)return;

  let path="";

  if(currentChatType==="dm"){
    path=
      `directMessages/${currentChatId}/messages/${id}`;
  }else{
    path=
      `groupChats/${currentGroup}/messages/${id}`;
  }

  await update(ref(db,path),{
    text:newText,
    edited:true
  });
}

async function createGroup(){

  const name=
    document.getElementById("groupNameInput")
      .value.trim();

  const error=
    document.getElementById("groupError");

  if(!name){
    error.textContent="Enter a group name.";
    return;
  }

  const selected=
    [...document.querySelectorAll(
      "#groupFriendList input:checked"
    )].map(x=>x.value);

  if(!selected.length){
    error.textContent=
      "Select at least one friend.";
    return;
  }

  const groupRef=
    push(ref(db,"groupChats"));

  const groupId=groupRef.key;

  const members={
    [key(currentUser)]:true
  };

  selected.forEach(u=>{
    members[key(u)]=true;
  });

  await set(groupRef,{
    name,
    creator:key(currentUser),
    members,
    createdAt:Date.now(),
    lastMessage:"",
    lastMessageTimestamp:0
  });

  for(const username of Object.keys(members)){

    await set(
      ref(db,
      `users/${username}/groups/${groupId}`),
      {
        name,
        creator:key(currentUser)
      }
    );
  }

  document.getElementById("groupModal")
    .classList.add("hidden");

  loadChats();
}

async function sendGroupMessage(){

  if(!currentGroup)return;

  const input=
    document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text)return;

  const message={
    username:currentUser,
    text,
    timestamp:Date.now(),
    edited:false
  };

  if(replyTo){
    message.replyTo=replyTo;
  }

  const messageRef=
    push(
      ref(db,
      `groupChats/${currentGroup}/messages`)
    );

  await set(messageRef,message);

  await updateConversationPreviewGroup(
    currentGroup,
    text,
    currentUser,
    message.timestamp
  );

  const snap=
    await get(
      ref(db,
      `groupChats/${currentGroup}/members`)
    );

  if(snap.exists()){

    const members=snap.val();

    for(const member of Object.keys(members)){

      if(member===key(currentUser))continue;

      const unreadRef=
        ref(db,
        `users/${member}/unread/group_${currentGroup}`);

      const unreadSnap=await get(unreadRef);

      await set(
        unreadRef,
        (unreadSnap.val() || 0)+1
      );
    }
  }

  input.value="";
  cancelReply();

  loadChats();
}


/* ---------------- GROUP MANAGEMENT ---------------- */

async function openGroupManagement(){

  if(!currentGroup)return;

  const snap=
    await get(ref(db,`groupChats/${currentGroup}`));

  if(!snap.exists())return;

  const group=snap.val();

  document.getElementById("renameGroupInput").value=
    group.name || "";

  const isCreator=
    key(group.creator)===key(currentUser);

  document.getElementById("renameGroupInput")
    .disabled=!isCreator;

  document.getElementById("renameGroupBtn")
    .disabled=!isCreator;

  renderGroupMembers(group);
  renderGroupAddFriends(group);

  document.getElementById("manageGroupError")
    .textContent="";

  document.getElementById("manageGroupModal")
    .classList.remove("hidden");
}


async function renderGroupMembers(group){

  const list=
    document.getElementById("groupMembersList");

  list.innerHTML="";

  const members=group.members || {};

  for(const memberKey of Object.keys(members)){

    await refreshUserCache(memberKey);

    const d=userDataCache[memberKey] || {};

    const row=document.createElement("div");

    row.className="memberRow";

    const creator=
      key(group.creator)===memberKey;

    row.innerHTML=`
      ${avatarHTML(memberKey)}
      <div class="memberName">
        ${escapeHTML(d.displayName || memberKey)}
        ${creator
          ? `<span class="creator">👑 Creator</span>`
          : ""}
      </div>
    `;

    if(
      key(group.creator)===key(currentUser) &&
      !creator
    ){

      const removeBtn=
        document.createElement("button");

      removeBtn.className="danger small";
      removeBtn.textContent="Remove";

      removeBtn.onclick=
        ()=>removeGroupMember(memberKey);

      row.appendChild(removeBtn);
    }

    list.appendChild(row);
  }
}


async function renderGroupAddFriends(group){

  const list=
    document.getElementById("groupAddFriendsList");

  list.innerHTML="";

  if(key(group.creator)!==key(currentUser)){
    list.innerHTML=
      `<div class="empty">Only the group creator can add members.</div>`;
    return;
  }

  const friendSnap=
    await get(
      ref(db,
      `users/${key(currentUser)}/friends`)
    );

  const friends=
    friendSnap.exists()?friendSnap.val():{};

  for(const friendKey of Object.keys(friends)){

    if(group.members?.[friendKey])continue;

    const username=
      friends[friendKey].username || friendKey;

    const row=document.createElement("div");

    row.className="memberRow";

    row.innerHTML=`
      ${avatarHTML(username)}
      <div class="memberName">
        ${escapeHTML(username)}
      </div>
    `;

    const addBtn=
      document.createElement("button");

    addBtn.className="small";
    addBtn.textContent="Add";

    addBtn.onclick=
      ()=>addGroupMember(username);

    row.appendChild(addBtn);

    list.appendChild(row);
  }

  if(!list.children.length){
    list.innerHTML=
      `<div class="empty">No friends available to add.</div>`;
  }
}


async function renameGroup(){

  if(!currentGroup)return;

  const snap=
    await get(ref(db,`groupChats/${currentGroup}`));

  if(!snap.exists())return;

  const group=snap.val();

  if(key(group.creator)!==key(currentUser)){
    return;
  }

  const name=
    document.getElementById("renameGroupInput")
      .value.trim();

  if(!name){
    document.getElementById("manageGroupError")
      .textContent="Group name cannot be empty.";
    return;
  }

  await update(
    ref(db,`groupChats/${currentGroup}`),
    {name}
  );

  const members=group.members || {};

  for(const member of Object.keys(members)){

    await update(
      ref(db,
      `users/${member}/groups/${currentGroup}`),
      {name}
    );
  }

  document.getElementById("manageGroupModal")
    .classList.add("hidden");

  openGroup(currentGroup);
  loadChats();
}


async function addGroupMember(username){

  if(!currentGroup)return;

  const snap=
    await get(ref(db,`groupChats/${currentGroup}`));

  if(!snap.exists())return;

  const group=snap.val();

  if(key(group.creator)!==key(currentUser)){
    return;
  }

  const memberKey=key(username);

  await set(
    ref(db,
    `groupChats/${currentGroup}/members/${memberKey}`),
    true
  );

  await set(
    ref(db,
    `users/${memberKey}/groups/${currentGroup}`),
    {
      name:group.name,
      creator:group.creator
    }
  );

  openGroupManagement();
}


async function removeGroupMember(username){

  if(!currentGroup)return;

  const snap=
    await get(ref(db,`groupChats/${currentGroup}`));

  if(!snap.exists())return;

  const group=snap.val();

  if(key(group.creator)!==key(currentUser)){
    return;
  }

  const memberKey=key(username);

  if(memberKey===key(group.creator))return;

  if(!confirm(`Remove ${username} from this group?`))
    return;

  await remove(
    ref(db,
    `groupChats/${currentGroup}/members/${memberKey}`)
  );

  await remove(
    ref(db,
    `users/${memberKey}/groups/${currentGroup}`)
  );

  openGroupManagement();
}


/* ---------------- RENDER MESSAGE ---------------- */

async function renderMessage(id,message){

  const container=
    document.getElementById("messages");

  if(!container)return;

  const old=
    document.querySelector(
      `[data-message-id="${id}"]`
    );

  if(old)old.remove();

  await refreshUserCache(message.username);

  const d=
    userDataCache[key(message.username)] || {};

  const wrapper=document.createElement("div");

  wrapper.className=
    "message" +
    (key(message.username)===key(currentUser)
      ? " mine"
      : "");

  wrapper.dataset.messageId=id;

  let replyHTML="";

  if(message.replyTo){

    replyHTML=`
      <div class="replyPreview"
           data-reply-id="${escapeHTML(message.replyTo.id)}">
        ↩️ <b>${escapeHTML(message.replyTo.username)}</b>:
        ${escapeHTML(message.replyTo.text)}
      </div>
    `;
  }

  let reactionsHTML="";

  if(message.reactions){

    const counts={};

    Object.values(message.reactions)
      .forEach(emoji=>{
        counts[emoji]=(counts[emoji]||0)+1;
      });

    reactionsHTML=
      `<div class="reactions">`+
      Object.entries(counts)
        .map(([emoji,count])=>
          `<span class="reaction">${emoji} ${count}</span>`
        )
        .join("")+
      `</div>`;
  }

  wrapper.innerHTML=`

    ${avatarHTML(message.username)}

    <div class="messageContent">

      ${
        currentChatType==="group"
        ? `<div class="sender">
             ${escapeHTML(d.displayName || message.username)}
             ${
               key(message.username)===key(
                 currentGroup?.creator || ""
               )
               ? " 👑"
               : ""
             }
           </div>`
        : ""
      }

      ${replyHTML}

      <div class="bubble">
        ${escapeHTML(message.text)}
      </div>

      <div class="messageTime">
        ${formatTime(message.timestamp)}
        ${
          message.edited
          ? `<span class="edited"> · edited</span>`
          : ""
        }
      </div>

      ${reactionsHTML}

      <div class="actions">

        <button data-reply>↩️</button>
        <button data-copy>📋</button>

        <button data-react="👍">👍</button>
        <button data-react="❤️">❤️</button>
        <button data-react="😂">😂</button>
        <button data-react="🔥">🔥</button>

        ${
          message.username===currentUser
          ? `
            <button data-edit>✏️</button>
            <button data-delete class="danger">🗑️</button>
          `
          : ""
        }

        <button data-pin>📌</button>

      </div>

    </div>
  `;

  wrapper.querySelector("[data-reply]")
    .onclick=()=>startReply(id,message);

  wrapper.querySelector("[data-copy]")
    .onclick=async()=>{
      try{
        await navigator.clipboard.writeText(message.text);
      }catch{}
    };

  wrapper.querySelectorAll("[data-react]")
    .forEach(btn=>{
      btn.onclick=()=>reactToMessage(
        id,
        btn.dataset.react
      );
    });

  wrapper.querySelector("[data-pin]")
    .onclick=()=>togglePin(id);

  const editBtn=
    wrapper.querySelector("[data-edit]");

  if(editBtn){
    editBtn.onclick=()=>editMessage(id);
  }

  const deleteBtn=
    wrapper.querySelector("[data-delete]");

  if(deleteBtn){
    deleteBtn.onclick=()=>deleteMessage(id);
  }

  const replyPreview=
    wrapper.querySelector(".replyPreview");

  if(replyPreview){

    replyPreview.onclick=()=>{
      jumpToMessage(
        replyPreview.dataset.replyId
      );
    };
  }

  container.appendChild(wrapper);

  container.scrollTop=
    container.scrollHeight;
}


async function rerenderMessage(id){

  const message=currentMessages[id];

  if(!message)return;

  await renderMessage(id,message);
}


/* ---------------- REPLIES ---------------- */

function startReply(id,message){

  replyTo={
    id,
    username:message.username,
    text:message.text
  };

  document.getElementById("replyText")
    .textContent=
      `↩️ Replying to ${message.username}: ${message.text}`;

  document.getElementById("replyBar")
    .classList.remove("hidden");

  document.getElementById("messageInput")
    .focus();
}


function cancelReply(){

  replyTo=null;

  document.getElementById("replyBar")
    .classList.add("hidden");
}


function jumpToMessage(id){

  const el=
    document.querySelector(
      `[data-message-id="${id}"]`
    );

  if(!el)return;

  el.scrollIntoView({
    behavior:"smooth",
    block:"center"
  });

  el.classList.add("highlight");

  setTimeout(()=>{
    el.classList.remove("highlight");
  },1200);
}


/* ---------------- REACTIONS ---------------- */

async function reactToMessage(id,emoji){

  let path="";

  if(currentChatType==="dm"){
    path=
      `directMessages/${currentChatId}/messages/${id}/reactions/${key(currentUser)}`;
  }else if(currentChatType==="group"){
    path=
      `groupChats/${currentGroup}/messages/${id}/reactions/${key(currentUser)}`;
  }else{
    return;
  }

  const snap=await get(ref(db,path));

  if(snap.exists() && snap.val()===emoji){
    await remove(ref(db,path));
  }else{
    await set(ref(db,path),emoji);
  }
}


/* ---------------- PINNED MESSAGES ---------------- */

async function togglePin(id){

  let path="";

  if(currentChatType==="dm"){
    path=
      `directMessages/${currentChatId}/pinned/${id}`;
  }else if(currentChatType==="group"){
    path=
      `groupChats/${currentGroup}/pinned/${id}`;
  }else{
    return;
  }

  const snap=await get(ref(db,path));

  if(snap.exists()){
    await remove(ref(db,path));
  }else{
    await set(ref(db,path),true);
  }
}


async function showPins(){

  const list=
    document.getElementById("pinsList");

  list.innerHTML="";

  let base="";

  if(currentChatType==="dm"){
    base=`directMessages/${currentChatId}`;
  }else if(currentChatType==="group"){
    base=`groupChats/${currentGroup}`;
  }else{
    return;
  }

  const pinsSnap=
    await get(ref(db,`${base}/pinned`));

  const pins=
    pinsSnap.exists()?pinsSnap.val():{};

  if(!Object.keys(pins).length){

    list.innerHTML=
      `<div class="empty">No pinned messages.</div>`;

    document.getElementById("pinsModal")
      .classList.remove("hidden");

    return;
  }

  for(const id of Object.keys(pins)){

    const msg=currentMessages[id];

    if(!msg)continue;

    const item=document.createElement("div");

    item.className="pinItem";

    item.innerHTML=`
      📌 <b>${escapeHTML(msg.username)}</b><br>
      ${escapeHTML(msg.text)}
    `;

    item.onclick=()=>{
      document.getElementById("pinsModal")
        .classList.add("hidden");

      jumpToMessage(id);
    };

    list.appendChild(item);
  }

  document.getElementById("pinsModal")
    .classList.remove("hidden");
}


/* ---------------- MESSAGE SEARCH ---------------- */

function openSearch(){

  document.getElementById("searchBox")
    .classList.add("show");

  document.getElementById("messageSearch")
    .focus();

  updateSearchResults();
}


function closeSearch(){

  document.getElementById("searchBox")
    .classList.remove("show");

  searchMatches=[];

  document.querySelectorAll(".searchHighlight")
    .forEach(el=>
      el.classList.remove("searchHighlight")
    );

  document.getElementById("searchCount")
    .textContent="";
}


function updateSearchResults(){

  const input=
    document.getElementById("messageSearch");

  if(!input)return;

  const query=input.value.trim().toLowerCase();

  document.querySelectorAll(".searchHighlight")
    .forEach(el=>
      el.classList.remove("searchHighlight")
    );

  searchMatches=[];

  if(!query){

    document.getElementById("searchCount")
      .textContent="";

    return;
  }

  for(const id of Object.keys(currentMessages)){

    const message=currentMessages[id];

    if(
      String(message.text || "")
        .toLowerCase()
        .includes(query)
    ){
      searchMatches.push(id);
    }
  }

  searchIndex=0;

  document.getElementById("searchCount")
    .textContent=
      searchMatches.length
      ? `${searchMatches.length} match${searchMatches.length===1?"":"es"}`
      : "No matches";

  if(searchMatches.length){
    jumpToSearchMatch();
  }
}


function jumpToSearchMatch(){

  if(!searchMatches.length)return;

  document.querySelectorAll(".searchHighlight")
    .forEach(el=>
      el.classList.remove("searchHighlight")
    );

  const id=searchMatches[searchIndex];

  const el=
    document.querySelector(
      `[data-message-id="${id}"]`
    );

  if(el){

    el.classList.add("searchHighlight");

    el.scrollIntoView({
      behavior:"smooth",
      block:"center"
    });
  }

  document.getElementById("searchCount")
    .textContent=
      `${searchIndex+1}/${searchMatches.length} match${searchMatches.length===1?"":"es"}`;
}


function nextSearch(){

  if(!searchMatches.length)return;

  searchIndex=
    (searchIndex+1)%searchMatches.length;

  jumpToSearchMatch();
}


function previousSearch(){

  if(!searchMatches.length)return;

  searchIndex=
    (searchIndex-1+searchMatches.length)
    %searchMatches.length;

  jumpToSearchMatch();
}

async function updateUnreadBadge(){

  if(!currentUser)return;

  const snap=
    await get(
      ref(db,
      `users/${key(currentUser)}/unread`)
    );

  const unread=snap.exists()?snap.val():{};

  let total=0;

  Object.values(unread).forEach(v=>{
    if(typeof v==="number")total+=v;
  });

  const tab=
    document.getElementById("friendsTab");

  tab.innerHTML=
    total>0
    ? `👥 Friends <span class="tabUnread">${total}</span>`
    : "👥 Friends";
}


/* ---------------- ROOMS ---------------- */

async function joinRoom(){

  const code=
    document.getElementById("roomCode")
      .value.trim();

  if(!/^\d{4}$/.test(code)){
    document.getElementById("roomStatus")
      .textContent="Room code must be 4 digits.";
    return;
  }

  if(stopRoomListener){
    stopRoomListener();
    stopRoomListener=null;
  }

  stopCurrentChatListener();

  currentRoom=code;
  currentChatType="room";
  currentChatId=code;

  document.getElementById("roomStatus")
    .textContent=`Joined room ${code}`;

  document.getElementById("chatHeader")
    .innerHTML=`
      <div class="avatar">🏠</div>
      <div class="chatHeaderInfo">
        <div class="chatTitle">
          Room ${code}
        </div>
        <div class="chatSub">
          Public room
        </div>
      </div>
    `;

  document.getElementById("composer")
    .classList.remove("hidden");

  document.getElementById("messages")
    .innerHTML="";

  const messagesRef=
    ref(db,`rooms/${code}/messages`);

  const added=
    onChildAdded(messagesRef,snap=>{
      currentMessages[snap.key]=snap.val();
      renderMessage(snap.key,snap.val());
    });

  const changed=
    onChildChanged(messagesRef,snap=>{
      currentMessages[snap.key]=snap.val();
      rerenderMessage(snap.key);
    });

  const removed=
    onChildRemoved(messagesRef,snap=>{
      delete currentMessages[snap.key];

      const el=
        document.querySelector(
          `[data-message-id="${snap.key}"]`
        );

      if(el)el.remove();
    });

  stopRoomListener=()=>{
    added();
    changed();
    removed();
  };

  await set(
    push(ref(db,`rooms/${code}/messages`)),
    {
      username:"System",
      text:`${currentUser} joined the room.`,
      timestamp:Date.now()
    }
  );
}


async function sendRoomMessage(){

  if(!currentRoom)return;

  const input=
    document.getElementById("messageInput");

  const text=input.value.trim();

  if(!text)return;

  await set(
    push(
      ref(db,`rooms/${currentRoom}/messages`)
    ),
    {
      username:currentUser,
      text,
      timestamp:Date.now()
    }
  );

  input.value="";
}


/* ---------------- SEND ---------------- */

async function sendCurrentMessage(){

  if(currentChatType==="dm"){
    await sendDM();
  }else if(currentChatType==="group"){
    await sendGroupMessage();
  }else if(currentChatType==="room"){
    await sendRoomMessage();
  }
}
