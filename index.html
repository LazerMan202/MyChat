<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChat 1.5</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #111827;
  color: white;
}

button,
input,
textarea {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* LOGIN */

.auth-container {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.auth-box {
  width: 100%;
  max-width: 400px;
  background: #1f2937;
  padding: 30px;
  border-radius: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,.3);
}

.auth-box h1 {
  text-align: center;
  margin-top: 0;
}

.auth-box input {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 0;
  border-radius: 8px;
  background: #374151;
  color: white;
}

.auth-box button {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
}

.auth-box button.secondary {
  background: #374151;
}

.auth-message {
  color: #f87171;
  min-height: 20px;
  margin-top: 8px;
}

/* APP */

.app {
  height: 100vh;
  display: flex;
  flex-direction: column;
}

.header {
  height: 60px;
  background: #1f2937;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  border-bottom: 1px solid #374151;
}

.header h2 {
  margin: 0;
}

.header button {
  background: #374151;
  border: 0;
  color: white;
  padding: 8px 12px;
  border-radius: 8px;
}

/* TABS */

.tabs {
  display: flex;
  background: #1f2937;
  border-bottom: 1px solid #374151;
}

.tab {
  flex: 1;
  padding: 13px;
  border: 0;
  background: transparent;
  color: #9ca3af;
}

.tab.active {
  color: white;
  background: #374151;
}

/* CONTENT */

.content {
  flex: 1;
  overflow: hidden;
  display: flex;
}

.panel {
  width: 100%;
  height: 100%;
  overflow-y: auto;
  padding: 16px;
}

.card {
  background: #1f2937;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
}

/* FRIENDS */

.search-row {
  display: flex;
  gap: 8px;
}

.search-row input {
  flex: 1;
}

input,
textarea {
  background: #374151;
  color: white;
  border: 0;
  border-radius: 8px;
  padding: 10px;
}

.search-row button,
.action-button {
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
  padding: 10px 14px;
}

.user-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 12px 0;
  border-bottom: 1px solid #374151;
}

.user-row:last-child {
  border-bottom: 0;
}

.user-info {
  display: flex;
  align-items: center;
  gap: 10px;
}

.avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: #2563eb;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
}

.status {
  font-size: 12px;
}

.online {
  color: #4ade80;
}

.offline {
  color: #9ca3af;
}

/* ROOMS */

.room-input {
  width: 100%;
  margin-bottom: 10px;
}

.room-button {
  width: 100%;
  padding: 12px;
  border: 0;
  border-radius: 8px;
  background: #2563eb;
  color: white;
}

.room-chat {
  display: flex;
  flex-direction: column;
  height: calc(100vh - 180px);
}

.room-messages {
  flex: 1;
  overflow-y: auto;
  padding: 10px;
  background: #111827;
  border-radius: 10px;
  margin-bottom: 10px;
}

.message-input-row {
  display: flex;
  gap: 8px;
}

.message-input-row input {
  flex: 1;
}

/* DMs */

.dm-layout {
  height: 100%;
  display: flex;
  gap: 12px;
}

.conversations {
  width: 240px;
  background: #1f2937;
  border-radius: 12px;
  padding: 10px;
  overflow-y: auto;
}

.conversation {
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  margin-bottom: 5px;
}

.conversation:hover,
.conversation.active {
  background: #374151;
}

.unread {
  float: right;
  background: #2563eb;
  border-radius: 999px;
  padding: 2px 7px;
  font-size: 11px;
}

.dm-chat {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #1f2937;
  border-radius: 12px;
  overflow: hidden;
}

.dm-header {
  padding: 12px 16px;
  border-bottom: 1px solid #374151;
  font-weight: bold;
}

.dm-messages {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
}

.dm-input-area {
  border-top: 1px solid #374151;
  padding: 10px;
}

/* REPLY BAR */

.replying-bar {
  background: #374151;
  border-left: 4px solid #3b82f6;
  padding: 8px 10px;
  margin-bottom: 8px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.replying-text {
  min-width: 0;
}

.replying-title {
  font-size: 12px;
  color: #60a5fa;
  font-weight: bold;
}

.replying-preview {
  font-size: 13px;
  color: #d1d5db;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.cancel-reply {
  background: transparent;
  border: 0;
  color: #9ca3af;
  font-size: 18px;
}

/* MESSAGE */

.dm-message {
  margin-bottom: 12px;
  max-width: 80%;
}

.dm-message.mine {
  margin-left: auto;
}

.message-bubble {
  background: #374151;
  border-radius: 12px;
  padding: 10px;
}

.dm-message.mine .message-bubble {
  background: #2563eb;
}

.message-author {
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 4px;
}

.message-time {
  font-size: 10px;
  color: #9ca3af;
  margin-top: 4px;
}

.edited {
  font-size: 10px;
  color: #9ca3af;
  margin-left: 4px;
}

/* REPLY PREVIEW INSIDE MESSAGE */

.message-reply {
  background: rgba(0,0,0,.2);
  border-left: 3px solid #60a5fa;
  padding: 6px 8px;
  margin-bottom: 7px;
  border-radius: 5px;
  cursor: pointer;
}

.message-reply-author {
  color: #60a5fa;
  font-size: 11px;
  font-weight: bold;
}

.message-reply-text {
  color: #d1d5db;
  font-size: 12px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* MESSAGE ACTIONS */

.message-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.message-actions button {
  background: #374151;
  color: #d1d5db;
  border: 0;
  border-radius: 6px;
  padding: 4px 7px;
  font-size: 11px;
}

.dm-message.mine .message-actions button {
  background: #1d4ed8;
}

/* REACTIONS */

.reactions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 6px;
}

.reaction {
  border: 0;
  border-radius: 999px;
  padding: 3px 7px;
  background: #111827;
  color: white;
  cursor: pointer;
  font-size: 12px;
}

.reaction-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  background: #111827;
  padding: 5px;
  border-radius: 8px;
}

.reaction-picker button {
  background: transparent !important;
  font-size: 16px !important;
  padding: 4px !important;
}

/* PROFILE */

.profile-avatar {
  width: 80px;
  height: 80px;
  background: #2563eb;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  font-weight: bold;
  margin: 0 auto 15px;
}

.profile-card input,
.profile-card textarea {
  width: 100%;
  margin-bottom: 10px;
}

.profile-card textarea {
  min-height: 100px;
  resize: vertical;
}

.save-profile {
  width: 100%;
  padding: 12px;
  background: #2563eb;
  border: 0;
  color: white;
  border-radius: 8px;
}

/* HIGHLIGHT */

.highlight {
  animation: highlightMessage 1.5s ease;
}

@keyframes highlightMessage {
  0% {
    background: rgba(59,130,246,.5);
  }
  100% {
    background: transparent;
  }
}

/* MOBILE */

@media (max-width: 700px) {
  .dm-layout {
    flex-direction: column;
  }

  .conversations {
    width: 100%;
    max-height: 140px;
  }

  .dm-chat {
    min-height: 400px;
  }

  .dm-message {
    max-width: 90%;
  }
}
</style>
</head>

<body>

<!-- AUTH -->

<div id="authScreen" class="auth-container">
  <div class="auth-box">

    <div id="loginBox">
      <h1>💬 MyChat</h1>

      <input id="loginUsername" placeholder="Username">
      <input id="loginPassword" type="password" placeholder="Password">

      <button id="loginButton">Log In</button>
      <button id="showCreateButton" class="secondary">Create Account</button>

      <div id="loginMessage" class="auth-message"></div>
    </div>

    <div id="createBox" class="hidden">
      <h1>Create Account</h1>

      <input id="createUsername" placeholder="Username">
      <input id="createPassword" type="password" placeholder="Password">

      <button id="createButton">Create Account</button>
      <button id="showLoginButton" class="secondary">Back to Login</button>

      <div id="createMessage" class="auth-message"></div>
    </div>

  </div>
</div>

<!-- APP -->

<div id="app" class="app hidden">

  <div class="header">
    <h2>💬 MyChat</h2>
    <button id="logoutButton">Log Out</button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="friends">👥 Friends</button>
    <button class="tab" data-tab="rooms">🚪 Rooms</button>
    <button class="tab" data-tab="dms">💬 DMs</button>
    <button class="tab" data-tab="profile">👤 Profile</button>
  </div>

  <div class="content">

    <!-- FRIENDS -->

    <div id="friendsPanel" class="panel">

      <div class="card">
        <h3>Add Friend</h3>

        <div class="search-row">
          <input id="friendSearch" placeholder="Username">
          <button id="friendSearchButton">Search</button>
        </div>

        <div id="friendSearchResult"></div>
      </div>

      <div class="card">
        <h3>Friend Requests</h3>
        <div id="friendRequests"></div>
      </div>

      <div class="card">
        <h3>Friends</h3>
        <div id="friendsList"></div>
      </div>

    </div>

    <!-- ROOMS -->

    <div id="roomsPanel" class="panel hidden">

      <div id="roomJoin">
        <div class="card">
          <h3>Join a Room</h3>

          <input
            id="roomCode"
            class="room-input"
            maxlength="4"
            inputmode="numeric"
            placeholder="4-digit room code"
          >

          <button id="joinRoomButton" class="room-button">
            Join Room
          </button>

          <div id="roomMessage" class="auth-message"></div>
        </div>
      </div>

      <div id="roomChat" class="room-chat hidden">

        <div class="card">
          <strong>Room <span id="currentRoomDisplay"></span></strong>
          <button id="leaveRoomButton" class="action-button">
            Leave
          </button>
        </div>

        <div id="roomMessages" class="room-messages"></div>

        <div class="message-input-row">
          <input id="roomInput" placeholder="Type a message...">
          <button id="sendRoomButton" class="action-button">Send</button>
        </div>

      </div>

    </div>

    <!-- DMS -->

    <div id="dmsPanel" class="panel hidden">

      <div class="dm-layout">

        <div class="conversations">
          <h3>Conversations</h3>
          <div id="conversationList"></div>
        </div>

        <div class="dm-chat">

          <div id="dmHeader" class="dm-header">
            Select a conversation
          </div>

          <div id="dmMessages" class="dm-messages">
            <div style="color:#9ca3af;text-align:center;margin-top:40px;">
              Select a conversation to start chatting.
            </div>
          </div>

          <div class="dm-input-area">

            <div id="replyingBar" class="replying-bar hidden">
              <div class="replying-text">
                <div class="replying-title">Replying to <span id="replyingName"></span></div>
                <div id="replyingPreview" class="replying-preview"></div>
              </div>

              <button id="cancelReplyButton" class="cancel-reply">
                ✕
              </button>
            </div>

            <div class="message-input-row">
              <input id="dmInput" placeholder="Type a message...">
              <button id="sendDMButton" class="action-button">Send</button>
            </div>

          </div>

        </div>

      </div>

    </div>

    <!-- PROFILE -->

    <div id="profilePanel" class="panel hidden">

      <div class="card profile-card">

        <div id="profileAvatar" class="profile-avatar"></div>

        <h3 style="text-align:center;">
          @<span id="profileUsername"></span>
        </h3>

        <input id="displayNameInput" placeholder="Display name">

        <textarea id="bioInput" placeholder="Bio"></textarea>

        <button id="saveProfileButton" class="save-profile">
          Save Profile
        </button>

        <div id="profileMessage" style="text-align:center;margin-top:10px;"></div>

      </div>

    </div>

  </div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";

import {
  getDatabase,
  ref,
  get,
  set,
  push,
  remove,
  onChildAdded,
  onChildChanged,
  onChildRemoved,
  onValue,
  onDisconnect
}
from "https://www.gstatic.com/firebasejs/12.3.0/firebase-database.js";


/* FIREBASE */

const firebaseConfig = {
  apiKey: "AIzaSyDFun3M-6mzjBL8DFcfmJzDv7blNODQd0",
  authDomain: "mychat-8dac2.firebaseapp.com",
  databaseURL: "https://mychat-8dac2-default-rtdb.firebaseio.com",
  projectId: "mychat-8dac2",
  storageBucket: "mychat-8dac2.firebasestorage.app",
  messagingSenderId: "906137277444",
  appId: "1:906137277444:web:b9d52ef4ec1f76afe09151"
};

const appFirebase = initializeApp(firebaseConfig);
const db = getDatabase(appFirebase);


/* STATE */

let currentUser = null;
let currentRoom = null;
let currentDMUser = null;

let stopDMListener = null;
let stopRoomListener = null;

let currentReply = null;


/* HELPERS */

function key(username) {
  return username.toLowerCase();
}

async function hashPassword(password) {
  const data = new TextEncoder().encode(password);
  const hash = await crypto.subtle.digest("SHA-256", data);

  return [...new Uint8Array(hash)]
    .map(b => b.toString(16).padStart(2, "0"))
    .join("");
}

function escapeHTML(text) {
  const div = document.createElement("div");
  div.textContent = text ?? "";
  return div.innerHTML;
}

function formatTime(timestamp) {
  if (!timestamp) return "";

  return new Date(timestamp).toLocaleString([], {
    month: "short",
    day: "numeric",
    hour: "numeric",
    minute: "2-digit"
  });
}

function conversationId(a, b) {
  return [key(a), key(b)].sort().join("_");
}


/* AUTH SCREEN */

function showLogin() {
  document.getElementById("loginBox").classList.remove("hidden");
  document.getElementById("createBox").classList.add("hidden");
}

function showCreate() {
  document.getElementById("loginBox").classList.add("hidden");
  document.getElementById("createBox").classList.remove("hidden");
}

document.getElementById("showCreateButton")
  .addEventListener("click", showCreate);

document.getElementById("showLoginButton")
  .addEventListener("click", showLogin);


/* CREATE ACCOUNT */

async function createAccount() {

  const username =
    document.getElementById("createUsername").value.trim();

  const password =
    document.getElementById("createPassword").value;

  const message =
    document.getElementById("createMessage");

  message.textContent = "";

  if (!/^[A-Za-z0-9_]{3,20}$/.test(username)) {
    message.textContent =
      "Username must be 3–20 characters and use only letters, numbers, or _.";
    return;
  }

  if (password.length < 4) {
    message.textContent =
      "Password must be at least 4 characters.";
    return;
  }

  const userKey = key(username);

  const existing =
    await get(ref(db, `users/${userKey}`));

  if (existing.exists()) {
    message.textContent = "That username already exists.";
    return;
  }

  const passwordHash =
    await hashPassword(password);

  await set(ref(db, `users/${userKey}`), {
    username: username,
    passwordHash: passwordHash,
    displayName: username,
    bio: "",
    online: false
  });

  message.style.color = "#4ade80";
  message.textContent =
    "Account created! You can now log in.";

  document.getElementById("createUsername").value = "";
  document.getElementById("createPassword").value = "";

  setTimeout(showLogin, 700);
}

document.getElementById("createButton")
  .addEventListener("click", createAccount);


/* LOGIN */

async function login() {

  const username =
    document.getElementById("loginUsername").value.trim();

  const password =
    document.getElementById("loginPassword").value;

  const message =
    document.getElementById("loginMessage");

  message.textContent = "";

  if (!username || !password) {
    message.textContent =
      "Enter your username and password.";
    return;
  }

  const userKey = key(username);

  const snapshot =
    await get(ref(db, `users/${userKey}`));

  if (!snapshot.exists()) {
    message.textContent =
      "Username or password is incorrect.";
    return;
  }

  const data = snapshot.val();

  const passwordHash =
    await hashPassword(password);

  if (data.passwordHash !== passwordHash) {
    message.textContent =
      "Username or password is incorrect.";
    return;
  }

  currentUser = {
    key: userKey,
    username: data.username
  };

  await set(
    ref(db, `users/${userKey}/online`),
    true
  );

  onDisconnect(
    ref(db, `users/${userKey}/online`)
  ).set(false);

  showHome();
}

document.getElementById("loginButton")
  .addEventListener("click", login);


/* ENTER TO LOGIN */

document.getElementById("loginPassword")
  .addEventListener("keydown", e => {
    if (e.key === "Enter") login();
  });

document.getElementById("createPassword")
  .addEventListener("keydown", e => {
    if (e.key === "Enter") createAccount();
  });


/* HOME */

function showHome() {

  document.getElementById("authScreen")
    .classList.add("hidden");

  document.getElementById("app")
    .classList.remove("hidden");

  loadFriends();
  loadFriendRequests();
  loadConversations();
  loadProfile();

  switchTab("friends");
}


/* TABS */

function switchTab(tab) {

  document.querySelectorAll(".tab")
    .forEach(button => {
      button.classList.toggle(
        "active",
        button.dataset.tab === tab
      );
    });

  document.getElementById("friendsPanel")
    .classList.toggle("hidden", tab !== "friends");

  document.getElementById("roomsPanel")
    .classList.toggle("hidden", tab !== "rooms");

  document.getElementById("dmsPanel")
    .classList.toggle("hidden", tab !== "dms");

  document.getElementById("profilePanel")
    .classList.toggle("hidden", tab !== "profile");
}

document.querySelectorAll(".tab")
  .forEach(button => {
    button.addEventListener("click", () => {
      switchTab(button.dataset.tab);
    });
  });


/* FRIEND SEARCH */

document.getElementById("friendSearchButton")
  .addEventListener("click", searchFriend);

async function searchFriend() {

  const username =
    document.getElementById("friendSearch")
      .value.trim();

  const result =
    document.getElementById("friendSearchResult");

  result.innerHTML = "";

  if (!username) return;

  const userSnapshot =
    await get(ref(db, `users/${key(username)}`));

  if (!userSnapshot.exists()) {
    result.innerHTML =
      `<p style="color:#9ca3af;">User not found.</p>`;
    return;
  }

  if (key(username) === currentUser.key) {
    result.innerHTML =
      `<p style="color:#9ca3af;">That's you!</p>`;
    return;
  }

  const friendSnapshot =
    await get(
      ref(
        db,
        `users/${currentUser.key}/friends/${key(username)}`
      )
    );

  if (friendSnapshot.exists()) {
    result.innerHTML =
      `<p style="color:#4ade80;">Already friends.</p>`;
    return;
  }

  const button =
    document.createElement("button");

  button.className = "action-button";
  button.textContent = `Add ${userSnapshot.val().username}`;

  button.addEventListener("click", async () => {

    await set(
      ref(
        db,
        `users/${key(username)}/friendRequests/${currentUser.key}`
      ),
      {
        username: currentUser.username,
        timestamp: Date.now()
      }
    );

    result.innerHTML =
      `<p style="color:#4ade80;">Friend request sent!</p>`;
  });

  result.appendChild(button);
}


/* FRIEND REQUESTS */

async function loadFriendRequests() {

  const container =
    document.getElementById("friendRequests");

  container.innerHTML = "";

  const snapshot =
    await get(
      ref(
        db,
        `users/${currentUser.key}/friendRequests`
      )
    );

  if (!snapshot.exists()) {
    container.innerHTML =
      `<p style="color:#9ca3af;">No friend requests.</p>`;
    return;
  }

  Object.entries(snapshot.val())
    .forEach(([requestKey, request]) => {

      const row =
        document.createElement("div");

      row.className = "user-row";

      row.innerHTML = `
        <div class="user-info">
          <div class="avatar">
            ${escapeHTML(request.username[0]?.toUpperCase() || "?")}
          </div>

          <div>
            <strong>${escapeHTML(request.username)}</strong>
          </div>
        </div>

        <div>
          <button class="action-button">Accept</button>
          <button class="action-button" style="background:#4b5563;">
            Decline
          </button>
        </div>
      `;

      const buttons = row.querySelectorAll("button");

      buttons[0].addEventListener("click", async () => {

        await set(
          ref(
            db,
            `users/${currentUser.key}/friends/${requestKey}`
          ),
          true
        );

        await set(
          ref(
            db,
            `users/${requestKey}/friends/${currentUser.key}`
          ),
          true
        );

        await remove(
          ref(
            db,
            `users/${currentUser.key}/friendRequests/${requestKey}`
          )
        );

        loadFriendRequests();
        loadFriends();
      });

      buttons[1].addEventListener("click", async () => {

        await remove(
          ref(
            db,
            `users/${currentUser.key}/friendRequests/${requestKey}`
          )
        );

        loadFriendRequests();
      });

      container.appendChild(row);
    });
}


/* FRIENDS */

async function loadFriends() {

  const container =
    document.getElementById("friendsList");

  container.innerHTML = "";

  const snapshot =
    await get(
      ref(
        db,
        `users/${currentUser.key}/friends`
      )
    );

  if (!snapshot.exists()) {
    container.innerHTML =
      `<p style="color:#9ca3af;">No friends yet.</p>`;
    return;
  }

  for (const friendKey of Object.keys(snapshot.val())) {

    const friendSnapshot =
      await get(ref(db, `users/${friendKey}`));

    if (!friendSnapshot.exists()) continue;

    const friend =
      friendSnapshot.val();

    const row =
      document.createElement("div");

    row.className = "user-row";

    row.innerHTML = `
      <div class="user-info">

        <div class="avatar">
          ${escapeHTML(
            (friend.displayName || friend.username)[0]
              ?.toUpperCase() || "?"
          )}
        </div>

        <div>
          <strong>
            ${escapeHTML(friend.displayName || friend.username)}
          </strong>

          <div class="status ${
            friend.online ? "online" : "offline"
          }">
            ${friend.online ? "● Online" : "● Offline"}
          </div>
        </div>

      </div>

      <div>
        <button class="action-button dm-button">
          Message
        </button>

        <button
          class="action-button remove-friend"
          style="background:#4b5563;"
        >
          Remove
        </button>
      </div>
    `;

    row.querySelector(".dm-button")
      .addEventListener("click", () => {

        switchTab("dms");
        openDM(friend.username);
      });

    row.querySelector(".remove-friend")
      .addEventListener("click", async () => {

        await remove(
          ref(
            db,
            `users/${currentUser.key}/friends/${friendKey}`
          )
        );

        await remove(
          ref(
            db,
            `users/${friendKey}/friends/${currentUser.key}`
          )
        );

        loadFriends();
      });

    container.appendChild(row);
  }
}


/* CONVERSATIONS */

async function loadConversations() {

  const container =
    document.getElementById("conversationList");

  container.innerHTML = "";

  const snapshot =
    await get(
      ref(
        db,
        `users/${currentUser.key}/conversations`
      )
    );

  if (!snapshot.exists()) {
    container.innerHTML =
      `<p style="color:#9ca3af;padding:8px;">No conversations.</p>`;
    return;
  }

  const conversations =
    snapshot.val();

  const unreadSnapshot =
    await get(
      ref(
        db,
        `users/${currentUser.key}/unread`
      )
    );

  const unread =
    unreadSnapshot.exists()
      ? unreadSnapshot.val()
      : {};

  Object.keys(conversations)
    .forEach(friendKey => {

      const row =
        document.createElement("div");

      row.className = "conversation";

      const count =
        unread[friendKey] || 0;

      row.innerHTML = `
        ${escapeHTML(
          conversations[friendKey].displayName ||
          conversations[friendKey].username ||
          friendKey
        )}

        ${
          count > 0
            ? `<span class="unread">${count}</span>`
            : ""
        }
      `;

      row.addEventListener("click", () => {

        openDM(
          conversations[friendKey].username ||
          friendKey
        );
      });

      container.appendChild(row);
    });
}


/* OPEN DM */

async function openDM(username) {

  currentDMUser = username;

  cancelReply();

  if (stopDMListener) {
    stopDMListener();
    stopDMListener = null;
  }

  document.getElementById("dmHeader")
    .textContent = `💬 ${username}`;

  const messagesContainer =
    document.getElementById("dmMessages");

  messagesContainer.innerHTML = "";

  const convoId =
    conversationId(
      currentUser.username,
      username
    );

  await set(
    ref(
      db,
      `users/${currentUser.key}/unread/${key(username)}`
    ),
    0
  );

  const friendSnapshot =
    await get(
      ref(
        db,
        `users/${key(username)}`
      )
    );

  if (friendSnapshot.exists()) {

    await set(
      ref(
        db,
        `users/${currentUser.key}/conversations/${key(username)}`
      ),
      {
        username: friendSnapshot.val().username,
        displayName:
          friendSnapshot.val().displayName ||
          friendSnapshot.val().username
      }
    );
  }

  loadConversations();

  const messagesRef =
    ref(
      db,
      `directMessages/${convoId}/messages`
    );

  const messageElements = new Map();

  function renderMessage(id, data) {

    const existing =
      messageElements.get(id);

    if (existing) {
      updateMessageElement(existing, id, data);
      return;
    }

    const element =
      document.createElement("div");

    element.className =
      "dm-message " +
      (data.username === currentUser.username
        ? "mine"
        : "");

    element.dataset.id = id;

    updateMessageElement(element, id, data);

    messageElements.set(id, element);

    messagesContainer.appendChild(element);

    messagesContainer.scrollTop =
      messagesContainer.scrollHeight;
  }

  function updateMessageElement(element, id, data) {

    const mine =
      data.username === currentUser.username;

    const reply =
      data.replyTo;

    let reactionsHTML = "";

    if (data.reactions) {

      const counts = {};

      Object.values(data.reactions)
        .forEach(emoji => {
          counts[emoji] =
            (counts[emoji] || 0) + 1;
        });

      reactionsHTML =
        `<div class="reactions">` +
        Object.entries(counts)
          .map(([emoji, count]) =>
            `<button class="reaction" data-reaction="${emoji}">
              ${emoji} ${count}
            </button>`
          )
          .join("") +
        `</div>`;
    }

    const replyHTML =
      reply
        ? `
          <div class="message-reply" data-reply-id="${escapeHTML(reply.id)}">
            <div class="message-reply-author">
              ↩ ${escapeHTML(reply.username)}
            </div>

            <div class="message-reply-text">
              ${escapeHTML(reply.text)}
            </div>
          </div>
        `
        : "";

    element.innerHTML = `
      <div class="message-bubble">

        ${
          !mine
            ? `<div class="message-author">
                ${escapeHTML(data.username)}
              </div>`
            : ""
        }

        ${replyHTML}

        <div>
          ${escapeHTML(data.text)}
          ${
            data.edited
              ? `<span class="edited">(edited)</span>`
              : ""
          }
        </div>

        <div class="message-time">
          ${formatTime(data.timestamp)}
        </div>

        <div class="message-actions">

          <button class="reply-button">
            ↩ Reply
          </button>

          <button class="copy-button">
            📋 Copy
          </button>

          <button class="reaction-button">
            😊 React
          </button>

          ${
            mine
              ? `
                <button class="edit-button">
                  ✏️ Edit
                </button>

                <button class="delete-button">
                  🗑 Delete
                </button>
              `
              : ""
          }

        </div>

        <div class="reaction-area"></div>

        ${reactionsHTML}

      </div>
    `;

    /* REPLY */

    element.querySelector(".reply-button")
      .addEventListener("click", () => {

        currentReply = {
          id: id,
          username: data.username,
          text: data.text
        };

        document.getElementById("replyingName")
          .textContent = data.username;

        document.getElementById("replyingPreview")
          .textContent = data.text;

        document.getElementById("replyingBar")
          .classList.remove("hidden");

        document.getElementById("dmInput")
          .focus();
      });


    /* COPY */

    element.querySelector(".copy-button")
      .addEventListener("click", async () => {

        try {

          await navigator.clipboard
            .writeText(data.text);

          const button =
            element.querySelector(".copy-button");

          button.textContent = "✅ Copied!";

          setTimeout(() => {
            button.textContent = "📋 Copy";
          }, 1200);

        } catch {
          alert("Couldn't copy the message.");
        }
      });


    /* REACTION PICKER */

    element.querySelector(".reaction-button")
      .addEventListener("click", () => {

        const area =
          element.querySelector(".reaction-area");

        if (area.innerHTML) {
          area.innerHTML = "";
          return;
        }

        const picker =
          document.createElement("div");

        picker.className =
          "reaction-picker";

        const emojis = [
          "👍",
          "❤️",
          "😂",
          "😮",
          "😢",
          "😡",
          "🔥",
          "🎉",
          "👏",
          "💯"
        ];

        emojis.forEach(emoji => {

          const button =
            document.createElement("button");

          button.textContent = emoji;

          button.addEventListener(
            "click",
            async () => {

              await set(
                ref(
                  db,
                  `directMessages/${convoId}/messages/${id}/reactions/${currentUser.key}`
                ),
                emoji
              );

              area.innerHTML = "";
            }
          );

          picker.appendChild(button);
        });

        area.appendChild(picker);
      });


    /* DELETE */

    const deleteButton =
      element.querySelector(".delete-button");

    if (deleteButton) {

      deleteButton.addEventListener(
        "click",
        async () => {

          await remove(
            ref(
              db,
              `directMessages/${convoId}/messages/${id}`
            )
          );
        }
      );
    }


    /* EDIT */

    const editButton =
      element.querySelector(".edit-button");

    if (editButton) {

      editButton.addEventListener(
        "click",
        async () => {

          const newText =
            prompt(
              "Edit your message:",
              data.text
            );

          if (
            newText === null ||
            !newText.trim()
          ) return;

          await set(
            ref(
              db,
              `directMessages/${convoId}/messages/${id}/text`
            ),
            newText.trim()
          );

          await set(
            ref(
              db,
              `directMessages/${convoId}/messages/${id}/edited`
            ),
            true
          );
        }
      );
    }


    /* CLICK REPLY PREVIEW */

    const replyPreview =
      element.querySelector(".message-reply");

    if (replyPreview) {

      replyPreview.addEventListener(
        "click",
        () => {

          const targetId =
            replyPreview.dataset.replyId;

          const target =
            messageElements.get(targetId);

          if (!target) return;

          target.scrollIntoView({
            behavior: "smooth",
            block: "center"
          });

          target.classList.remove("highlight");

          void target.offsetWidth;

          target.classList.add("highlight");
        }
      );
    }


    /* EXISTING REACTIONS */

    element.querySelectorAll(".reaction")
      .forEach(button => {

        button.addEventListener(
          "click",
          async () => {

            await set(
              ref(
                db,
                `directMessages/${convoId}/messages/${id}/reactions/${currentUser.key}`
              ),
              button.dataset.reaction
            );
          }
        );
      });
  }


  const unsubAdded =
    onChildAdded(
      messagesRef,
      snapshot => {
        renderMessage(
          snapshot.key,
          snapshot.val()
        );
      }
    );


  const unsubChanged =
    onChildChanged(
      messagesRef,
      snapshot => {

        renderMessage(
          snapshot.key,
          snapshot.val()
        );
      }
    );


  const unsubRemoved =
    onChildRemoved(
      messagesRef,
      snapshot => {

        const element =
          messageElements.get(snapshot.key);

        if (element) {
          element.remove();
          messageElements.delete(snapshot.key);
        }
      }
    );


  stopDMListener = () => {

    unsubAdded();
    unsubChanged();
    unsubRemoved();

    messageElements.clear();
  };
}


/* CANCEL REPLY */

function cancelReply() {

  currentReply = null;

  document.getElementById("replyingBar")
    .classList.add("hidden");

  document.getElementById("replyingName")
    .textContent = "";

  document.getElementById("replyingPreview")
    .textContent = "";
}

document.getElementById("cancelReplyButton")
  .addEventListener("click", cancelReply);


/* SEND DM */

async function sendDM() {

  if (!currentDMUser) return;

  const input =
    document.getElementById("dmInput");

  const text =
    input.value.trim();

  if (!text) return;

  const convoId =
    conversationId(
      currentUser.username,
      currentDMUser
    );

  const messageData = {
    username: currentUser.username,
    text: text,
    timestamp: Date.now()
  };

  if (currentReply) {

    messageData.replyTo = {
      id: currentReply.id,
      username: currentReply.username,
      text: currentReply.text
    };
  }

  await push(
    ref(
      db,
      `directMessages/${convoId}/messages`
    ),
    messageData
  );


  /* SAVE CONVERSATION FOR SENDER */

  await set(
    ref(
      db,
      `users/${currentUser.key}/conversations/${key(currentDMUser)}`
    ),
    {
      username: currentDMUser,
      displayName: currentDMUser
    }
  );


  /* SAVE CONVERSATION FOR RECIPIENT */

  await set(
    ref(
      db,
      `users/${key(currentDMUser)}/conversations/${currentUser.key}`
    ),
    {
      username: currentUser.username,
      displayName: currentUser.username
    }
  );


  /* UNREAD */

  const unreadRef =
    ref(
      db,
      `users/${key(currentDMUser)}/unread/${currentUser.key}`
    );

  const unreadSnapshot =
    await get(unreadRef);

  const unread =
    unreadSnapshot.exists()
      ? unreadSnapshot.val()
      : 0;

  await set(
    unreadRef,
    unread + 1
  );


  input.value = "";

  cancelReply();

  loadConversations();
}

document.getElementById("sendDMButton")
  .addEventListener("click", sendDM);

document.getElementById("dmInput")
  .addEventListener("keydown", e => {

    if (
      e.key === "Enter" &&
      !e.shiftKey
    ) {
      e.preventDefault();
      sendDM();
    }
  });


/* ROOMS */

document.getElementById("joinRoomButton")
  .addEventListener("click", joinRoom);

async function joinRoom() {

  const code =
    document.getElementById("roomCode")
      .value.trim();

  const message =
    document.getElementById("roomMessage");

  message.textContent = "";

  if (!/^\d{4}$/.test(code)) {
    message.textContent =
      "Room code must be exactly 4 digits.";
    return;
  }

  if (stopRoomListener) {
    stopRoomListener();
    stopRoomListener = null;
  }

  currentRoom = code;

  document.getElementById("roomJoin")
    .classList.add("hidden");

  document.getElementById("roomChat")
    .classList.remove("hidden");

  document.getElementById("currentRoomDisplay")
    .textContent = code;

  const messagesRef =
    ref(
      db,
      `rooms/${code}/messages`
    );

  const messagesContainer =
    document.getElementById("roomMessages");

  messagesContainer.innerHTML = "";

  const unsub =
    onChildAdded(
      messagesRef,
      snapshot => {

        const data =
          snapshot.val();

        const div =
          document.createElement("div");

        div.style.marginBottom = "8px";

        div.innerHTML = `
          <strong>
            ${escapeHTML(data.username)}
          </strong>:
          ${escapeHTML(data.text)}

          <div style="font-size:10px;color:#9ca3af;">
            ${formatTime(data.timestamp)}
          </div>
        `;

        messagesContainer.appendChild(div);

        messagesContainer.scrollTop =
          messagesContainer.scrollHeight;
      }
    );

  stopRoomListener = unsub;
}


async function sendRoomMessage() {

  if (!currentRoom) return;

  const input =
    document.getElementById("roomInput");

  const text =
    input.value.trim();

  if (!text) return;

  await push(
    ref(
      db,
      `rooms/${currentRoom}/messages`
    ),
    {
      username: currentUser.username,
      text: text,
      timestamp: Date.now()
    }
  );

  input.value = "";
}

document.getElementById("sendRoomButton")
  .addEventListener("click", sendRoomMessage);

document.getElementById("roomInput")
  .addEventListener("keydown", e => {

    if (e.key === "Enter") {
      sendRoomMessage();
    }
  });


/* LEAVE ROOM */

document.getElementById("leaveRoomButton")
  .addEventListener("click", () => {

    if (stopRoomListener) {
      stopRoomListener();
      stopRoomListener = null;
    }

    currentRoom = null;

    document.getElementById("roomJoin")
      .classList.remove("hidden");

    document.getElementById("roomChat")
      .classList.add("hidden");

    document.getElementById("roomMessages")
      .innerHTML = "";
  });


/* PROFILE */

async function loadProfile() {

  const snapshot =
    await get(
      ref(
        db,
        `users/${currentUser.key}`
      )
    );

  if (!snapshot.exists()) return;

  const data =
    snapshot.val();

  document.getElementById("profileUsername")
    .textContent = currentUser.username;

  document.getElementById("displayNameInput")
    .value =
      data.displayName ||
      data.username;

  document.getElementById("bioInput")
    .value =
      data.bio || "";

  updateProfileAvatar(
    data.displayName ||
    data.username
  );
}


function updateProfileAvatar(name) {

  document.getElementById("profileAvatar")
    .textContent =
      name?.[0]?.toUpperCase() || "?";
}


document.getElementById("saveProfileButton")
  .addEventListener("click", async () => {

    const displayName =
      document.getElementById("displayNameInput")
        .value.trim();

    const bio =
      document.getElementById("bioInput")
        .value.trim();

    const finalName =
      displayName ||
      currentUser.username;

    await set(
      ref(
        db,
        `users/${currentUser.key}/displayName`
      ),
      finalName
    );

    await set(
      ref(
        db,
        `users/${currentUser.key}/bio`
      ),
      bio
    );

    updateProfileAvatar(finalName);

    const message =
      document.getElementById("profileMessage");

    message.style.color = "#4ade80";
    message.textContent =
      "Profile saved!";

    setTimeout(() => {
      message.textContent = "";
    }, 1500);
  });


/* LOGOUT */

document.getElementById("logoutButton")
  .addEventListener("click", async () => {

    if (!currentUser) return;

    await set(
      ref(
        db,
        `users/${currentUser.key}/online`
      ),
      false
    );

    if (stopDMListener) {
      stopDMListener();
      stopDMListener = null;
    }

    if (stopRoomListener) {
      stopRoomListener();
      stopRoomListener = null;
    }

    currentUser = null;
    currentDMUser = null;
    currentRoom = null;

    cancelReply();

    document.getElementById("app")
      .classList.add("hidden");

    document.getElementById("authScreen")
      .classList.remove("hidden");

    document.getElementById("loginUsername")
      .value = "";

    document.getElementById("loginPassword")
      .value = "";

    document.getElementById("loginMessage")
      .textContent = "";

    showLogin();
  });

</script>
